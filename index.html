.tabline{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.tabline button{border:0;background:#fff;min-height:44px;font-size:12px;font-weight:700;color:var(--sub)}.tabline button.active{background:var(--orange);color:#fff}
.setting-row{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-bottom:1px solid #EEF1F4;gap:12px}.setting-row:last-child{border-bottom:0}.switch{width:48px;height:28px;border-radius:999px;background:#D9DEE6;padding:3px;border:0;position:relative;flex:0 0 auto}.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.14);transition:.18s}.switch.on{background:var(--orange)}.switch.on::after{left:23px}
.modal-back{position:fixed;inset:0;background:rgba(18,25,38,.38);z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:430px;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.15);will-change:transform}.sheet-handle{width:44px;height:5px;border-radius:99px;background:#CED5DE;margin:2px auto 14px}.modal-card{width:calc(100% - 32px);max-width:398px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 18px 54px rgba(0,0,0,.20);align-self:center}

/* Compact 9H scorecard */
.sc-page{padding-top:17px}
.sc-overview{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 16px}
.sc-overview>div:first-child{flex:1;min-width:0}
.sc-overview>div:first-child strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-overview small{display:block;margin-top:5px;color:var(--sub);font-size:11px}
.sc-overview .sc-total{text-align:right;flex-shrink:0}
.sc-total strong{display:block;font-size:33px;font-weight:850;line-height:1}
.sc-total small{color:var(--orange);font-weight:800}
.sc-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:13px;background:#E9EDF3;margin-bottom:13px}
.sc-switch button{border:0;background:transparent;color:#738092;min-height:42px;border-radius:9px;font-weight:800;font-size:12px}
.sc-switch button.active{background:#fff;color:var(--orange);box-shadow:0 2px 8px #17203312}
.sc-section{color:var(--orange);font-weight:800;font-size:13px;margin-bottom:12px}
.sc-board{background:#fff;border:1px solid #E4EAF1;border-radius:14px;padding:8px 5px;box-shadow:var(--shadow)}
.sc-grid{display:grid;grid-template-columns:42px repeat(9,minmax(0,1fr));gap:2px}
.sc-cell{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;min-height:36px;padding:2px 0;font-size:10px;line-height:1.2;text-align:center;font-weight:650;background:#F8F9FB;overflow:hidden}
.sc-cell.sc-label{background:#ECF0F5;color:#556273;font-weight:800;font-size:9px}
.sc-cell.sc-head{border:0;background:var(--orange);color:#fff;min-height:39px;font-weight:850;font-size:12px}
.sc-head-label{font-size:10px!important;border-radius:6px 0 0 6px}
.sc-cell.sc-under{background:#EAF1FF;color:var(--blue);font-weight:850;font-size:12px}
.sc-cell.sc-over{background:#FFF0E7;color:#D75617;font-weight:850;font-size:12px}
.sc-cell.sc-even{background:#F4F6F8;font-weight:850;font-size:12px}
.sc-cell.sc-yes{color:var(--blue);font-weight:850;font-size:13px}
.sc-cell.sc-tee{font-size:9px}
.sc-cell.sc-tee span,.sc-cell.sc-tee small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:9px}
.sc-cell.sc-tee small{color:var(--sub)}
.sc-board-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 5px 3px}
.sc-board-foot span{font-size:10px;color:var(--sub)}
.sc-board-foot strong{font-size:12px;white-space:nowrap}
.sc-board-foot b{font-size:14px;color:var(--orange);margin-left:4px}
.sc-legend{display:flex;justify-content:center;gap:18px;color:var(--sub);font-size:10px;margin:14px 0 18px}
.sc-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
.sc-dot-over{background:#FFF0E7;border:1px solid #FFBC9D}
.sc-dot-under{background:#EAF1FF;border:1px solid #AAC5FB}
.sc-summary{background:#fff;border:1px solid #E9EDF3;border-radius:14px;padding:16px}
.sc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sc-stats>div{background:#F5F7FA;border-radius:10px;text-align:center;padding:13px 4px}
.sc-stats small{display:block;font-size:10px;color:var(--sub);margin-bottom:4px}
.sc-stats strong{font-size:21px;font-weight:850}

.hole-sheet{padding:0;height:min(80dvh,730px);max-height:calc(100dvh - env(safe-area-inset-top) - 18px);display:flex;flex-direction:column;overflow:hidden}
.hole-sheet-header{flex-shrink:0;padding:10px 16px 13px;background:#fff;border-radius:22px 22px 0 0;border-bottom:1px solid #E6EBF2}
.hole-sheet .sheet-handle{margin:0 auto 13px}
.hole-sheet-heading{display:flex;justify-content:space-between;align-items:center}
.hole-sheet-heading>div{display:flex;align-items:baseline;gap:10px}
.hole-sheet-heading strong{font-size:21px;font-weight:850}
.hole-sheet-heading span{font-size:12px;color:var(--sub);font-weight:700}
.hole-sheet-close{border:0;border-radius:50%;width:33px;height:33px;background:#EFF2F6;color:#637083;font-size:21px}
.hole-sheet-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:13px 14px 20px;-webkit-overflow-scrolling:touch}
.hole-sheet-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hole-sheet-stats>div{background:#fff;border:1px solid #E9EDF3;border-radius:11px;text-align:center;padding:12px 4px}
.hole-sheet-stats span{display:block;font-size:10px;color:var(--sub)}
.hole-sheet-stats strong{display:block;font-size:23px;font-weight:850;margin-top:3px}
.hole-sheet-stats strong.orange{color:var(--orange)}
.hole-sheet-subtitle{font-size:14px;font-weight:800;margin:19px 2px 11px}
.hole-sheet-subtitle small{font-weight:500;font-size:10px;color:var(--sub);margin-left:5px}
.hole-shot-card{background:#fff;border:1px solid #E6EBF2;border-radius:12px;margin-bottom:9px;overflow:hidden}
.hole-shot-main{display:flex;align-items:center;width:100%;gap:9px;padding:12px 10px;text-align:left;background:#fff;border:0}
.hole-shot-num{background:#FFF0E7;color:var(--orange);font-size:13px;font-weight:850;width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center}
.hole-shot-num.putt{background:#EAF1FF;color:var(--blue)}
.hole-shot-center{flex:1;min-width:0}
.hole-shot-center strong{font-size:13px;font-weight:800;display:block}
.hole-shot-center small{font-size:10px;color:var(--sub);display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hole-shot-right{text-align:right;max-width:79px;min-width:54px}
.hole-shot-right strong{font-size:12px;font-weight:800;display:block}
.hole-shot-right small{font-size:10px;color:var(--sub);display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hole-shot-chevron{color:#A1AAB7;font-size:16px;margin-left:3px}
.hole-shot-detail{background:#F8FAFC;border-top:1px solid #E9EDF3;padding:10px 13px}
.hole-shot-detail-row{display:flex;align-items:baseline;justify-content:space-between;gap:15px;padding:6px 0;font-size:12px}
.hole-shot-detail-row span{color:var(--sub);white-space:nowrap}
.hole-shot-detail-row strong{text-align:right;overflow-wrap:anywhere;font-weight:750}
.hole-shot-actions{display:flex;gap:9px;margin-top:12px}
.hole-shot-actions button{border:1px solid #DFE5ED;border-radius:9px;background:#fff;min-height:42px;font-size:12px;font-weight:750;flex:1;padding:8px 5px}
.hole-shot-actions button.danger{color:#D04F3D;border-color:#F3D1CC}
.hole-sheet-memo{background:#fff;border-radius:12px;padding:13px;margin-top:15px;border:1px solid #E6EBF2}
.hole-sheet-memo strong{font-size:13px}
.hole-sheet-memo p{font-size:12px;color:var(--sub);line-height:1.6;white-space:pre-wrap;margin:9px 0 0}
.hole-sheet-footer{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;border-top:1px solid #E7ECF2;padding:11px 14px calc(12px + env(safe-area-inset-bottom))}
.hole-sheet-footer button{border:1px solid #E0E6EE;border-radius:10px;background:#fff;min-height:45px;font-size:13px;font-weight:800;color:var(--text)}
.hole-sheet-footer button.next{background:var(--orange);color:#fff;border-color:var(--orange)}
.hole-sheet-footer button:disabled{opacity:.36}

/* Scorecard v3: scrollable aggregate columns and tee direction icons. */
.sc-table-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:3px}
.sc-table-scroll::-webkit-scrollbar{height:3px}
.sc-table-scroll::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.sc-table-scroll .sc-grid{width:max-content;min-width:100%;grid-template-columns:initial;grid-auto-rows:minmax(36px,auto)}
.sc-cell.sc-head-aggregate{background:var(--blue);font-size:10px;font-weight:850}
.sc-cell.sc-head-total{background:#22344E}
.sc-cell.sc-aggregate{background:#ECF3FF;color:#274779;font-size:10px;font-weight:800}
.sc-cell.sc-aggregate-total{background:#E8EBF0;color:#1D293B}
.sc-cell.sc-aggregate small{display:block;font-size:9px;font-weight:650;color:#6B7F9A;margin-top:2px}
.sc-cell.sc-tee{gap:1px}
.sc-cell .sc-tee-club{font-size:9px;font-weight:850}
.sc-cell .sc-tee-arrow{display:block;color:var(--blue);font-size:17px;font-weight:750;line-height:1.1}

/* 18H continuous scorecard: keep field labels visible while swiping horizontally. */
.sc-table-scroll .sc-grid .sc-label{position:sticky;left:0;z-index:3;box-shadow:3px 0 5px rgba(23,32,51,.055)}
.sc-table-scroll .sc-grid .sc-head-label{position:sticky;left:0;z-index:4;box-shadow:3px 0 5px rgba(23,32,51,.09)}
.sc-table-scroll .sc-grid{align-items:stretch}
.sc-switch button{touch-action:manipulation}

/* A persistent storage failure notice: never present unsaved data as safe. */
.storage-alert{position:fixed;z-index:120;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),410px);padding:12px 14px;border-radius:12px;border:2px solid #E66042;background:#FFF4EF;color:#8C281F;font-size:12px;font-weight:750;line-height:1.55;box-shadow:0 8px 30px rgba(23,32,51,.18);pointer-events:none}

/* Round setup and registered course administration (iPhone 14) */
.settings-head-logo,.result-head-logo{border:0;background:transparent;min-height:44px;min-width:75px;padding:8px 0 8px 6px;display:inline-flex;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.settings-head-logo:focus-visible,.result-head-logo:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.setup-block{margin-bottom:14px}
.setup-block .card-title{font-size:17px;margin-bottom:8px}
.setup-help{color:var(--sub);font-size:12px;line-height:1.6;margin:5px 0 12px}
.setup-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setup-selector button{border:1px solid var(--border);border-radius:13px;padding:11px 7px;min-height:52px;background:white;font-weight:750;font-size:12px;line-height:1.4;color:var(--text)}
.setup-selector button.active{border:2px solid var(--orange);background:var(--orange-soft);color:#A94313}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.setup-grid .field{min-width:0}
.setup-grid .input,.setup-grid .select{width:100%}
.setup-caption{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
.course-manager-item{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--border);border-radius:14px;background:#fff;margin-bottom:10px}
.course-manager-name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:750;font-size:14px}
.course-manager-item .header-btn{min-height:44px;padding:0 10px}
.course-manager-item .danger{color:var(--error)}
.data-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.data-stat-card{border-radius:16px;background:#fff;border:1px solid var(--border);padding:14px}
.data-stat-card strong{display:block;font-size:25px;margin-top:5px}
.data-stat-card span{color:var(--sub);font-size:12px}
@media(max-width:350px){.setup-grid{gap:7px}.course-manager-item .header-btn{padding:0 6px}}

/* Round history and result: layout and navigation refinements only.
   Existing chart geometry, thresholds, data and color mappings are unchanged. */
.history-search-label{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.history-page{padding-top:18px}
.history-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:5px 2px 14px}
.history-page-head h2{font-size:22px;line-height:1.3;font-weight:850;margin:0}
.history-page-count{font-size:12px;color:var(--sub);font-weight:750;white-space:nowrap}
.history-search-wrap{position:relative;margin-bottom:10px}
.history-search-symbol{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#7D8899;pointer-events:none}
.history-search-input{display:block;width:100%;height:49px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:0 15px 0 43px;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.history-search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,228,.09)}
.history-toolbar{margin:3px 2px 11px;display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:11px}
.history-round-list{display:grid;gap:10px}
.history-round-card{width:100%;padding:15px 15px 12px;display:block;text-align:left;border:1px solid #E7EBF0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);min-height:98px;touch-action:manipulation}
.history-round-card:active{background:#FFF9F5;border-color:#FFD3BB}
.history-round-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.history-round-main{display:flex;align-items:center;justify-content:space-between;gap:10px}

  <div style="min-width:30px;height:30px;padding:5px 0;border-radius:10px;background:var(--orange-soft);color:var(--orange);font-size:13px;font-weight:850;text-align:center">${number}</div>
  <div style="flex:1;min-width:0"><div class="list-title">${title}</div><div class="list-sub" style="font-size:13px;line-height:1.7;margin-top:6px">${desc}</div></div>
 </div>`;
 return `${howtoHeader()}<div class="page" style="padding-top:18px">
 <div class="card">
  <div class="card-title" style="margin-bottom:6px">打って、記録して、振り返る。</div>
  <p class="card-sub" style="margin:0">Shot logは、ラウンド中のショットとスコアを記録し、あとからプレーの傾向を振り返るためのアプリです。</p>
 </div>

 <div class="section-head"><h2>最初に設定する3つ</h2></div>
 <div class="list">
 ${row('1','クラブ設定','設定 → クラブ設定で、使うクラブを最大14本まで登録します。種類・番手（表示名）・基準距離を設定してください。')}
 ${row('2','打ち方設定','設定 → 打ち方設定で、ラウンド中に使う打ち方をONにします。独自の打ち方を追加することもできます。')}
 ${row('3','Good・ミスの設定','設定 → Good・ミスの設定で、記録したい項目をONにします。独自の項目も追加でき、選んだ項目だけが入力画面に表示されます。')}
 </div>
 <div class="note" style="margin-top:12px">必要に応じて「ショット入力設定」で球筋・打感・傾斜・ライなどの表示を変更できます。「ラウンド設定」では、方向を9マス入力に自動切替する残り距離を設定できます。</div>

 <div class="section-head"><h2>ラウンドを始める</h2></div>
 <div class="list">
 ${row('1','ホームから「ラウンド開始」','登録済みのコースを選ぶか、新しいコース名を入力します。')}
 ${row('2','プレー情報とホール情報を設定','18H／9H、前半・後半のコース名、ティー、天気、グリーンを指定します。各ホールのPar・距離も確認・修正できます。')}
 ${row('3','「この設定で開始」をタップ','1ホール目のショット記録が始まります。途中で中断した場合は、ホームの「ラウンドを再開」から続けられます。')}
 </div>

 <div class="section-head"><h2>ラウンド中の記録</h2></div>
 <div class="list">
 ${row('1','ショットを記録','クラブ → 方向 → 球筋 → 打ち方 → 打感 → Good → ミス → 傾斜 → ライ → 到着地点 → 距離の順に入力します。設定でOFFにした項目は表示されません。')}
 ${row('2','方向・距離・ペナルティ','方向は「通常（左・中央・右）」と「グリーン（9マス）」を切替できます。残り距離が設定値以下なら9マスに自動切替します。ショット後の残り距離または直接飛距離を入力でき、OB・ハザード・ペナルティ時は罰打も選択できます。')}
 ${row('3','パットを記録','グリーンに到達したら最初のパット距離をmで入力します。ライ・到達位置・パット後の残り距離を記録し、中央の「Cup-in」でホールアウトします。距離調整は0.5m刻みです。')}
 ${row('4','ホールアウトと修正','各ホールのスコアとPUTT数を確認し、次のホールへ進みます。ショットの記録やホールのPar・距離は、ラウンド中に見直し・修正できます。')}
 </div>
 <div class="note" style="margin-top:12px">すべての項目を毎回埋める必要はありません。「未入力で次のショット」や手動ホールアウトも利用できます。ラウンド中はヘッダーからコースメモやスコアカードを開けます。</div>

 <div class="section-head"><h2>ラウンド後の振り返り</h2></div>
 <div class="list">
 ${row('1','ラウンド結果を見る','スコア・PUTT・FWキープ率・GIR・スコア分布・ショット方向・球筋・クラブ使用数・Good／ミスを確認できます。コースメモの追記・修正もできます。')}
 ${row('2','履歴から確認する','履歴一覧で過去のラウンドを選ぶと、結果サマリー・スコアカード・ホール別ショット履歴を確認できます。')}
 ${row('3','データ分析で傾向を確認','「全期間」「直近5R」「ラウンド別」「クラブ別」の4つを切り替えられます。全期間の月別推移や直近5Rの変化、クラブごとの飛距離・方向などを振り返れます。')}
 ${row('4','JSONをコピーする','3ホール終了後から、ラウンドの記録をJSON形式で表示・コピーできます。ラウンド結果の「JSON出力」から利用してください。')}
 </div>

 <div class="section-head"><h2>データの保存について</h2></div>
 <div class="card">
  <p class="card-sub" style="margin:0 0 10px">設定・コース・ラウンド記録は、このブラウザの端末内ストレージに保存されます。同じURLでもブラウザや保存領域が変わると、以前の記録が表示されない場合があります。</p>
  <p class="card-sub" style="margin:0">「設定 → データ管理」にはサンプルデータの削除と全データ削除があります。全データ削除やブラウザのデータ消去を行う前に、必要な記録を確認してください。JSON出力はラウンド単位のコピー機能です。</p>
 </div>
 </div>`;
}
function start(){
 const c=data.courses.find(x=>x.id===ui.start.courseId);
 const half=ui.start.holeCount===9?0:ui.courseEditHalf;
 const hs=(c?.holes||ui.start.newCourseHoles).slice(half?9:0,half?18:9);
 const labels=resolvedStartSections();
 const existing=Boolean(c),any=data.courses.length>0;
 const options=(values,selected)=>values.map(v=>'<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(v)+'</option>').join('');
 const sectionField=(label,key,otherKey)=>{
   const value=ui.start[key],id=key==='frontSection'?'front':'back';
   return '<div class="field"><div class="label">'+label+'</div><select class="select" id="start-'+id+'-section">'+options(['OUT','IN','その他'],value)+'</select>'
    +(value==='その他'?'<input class="input" id="start-'+id+'-other" maxlength="24" value="'+esc(ui.start[otherKey])+'" placeholder="例：'+(id==='front'?'西':'東')+'" style="margin-top:8px">':'')+'</div>';
 };
 const tees=['Back','Regular','Front','Ladies','その他'];
 const holeRows=hs.map(h=>'<div class="row" style="margin-bottom:8px"><strong style="width:32px">'+h.number+'H</strong><select class="select hole-par" data-hole="'+h.number+'" style="min-height:42px;width:88px">'+options([3,4,5,6],h.par)+'</select><input class="input hole-distance" data-hole="'+h.number+'" type="number" inputmode="numeric" value="'+esc(h.distance)+'" style="min-height:42px"><span class="small muted">yd</span></div>').join('');
 const golfField=existing?
   '<div class="field"><div class="label">ゴルフ場</div><select class="select" id="start-course">'+data.courses.map(x=>'<option value="'+esc(x.id)+'" '+(ui.start.courseId===x.id?'selected':'')+'>'+esc(x.name)+' / '+esc(x.tee)+'</option>').join('')+'</select></div>':
   '<div class="field"><div class="label">新しいゴルフ場名</div><input class="input" id="start-course-name" maxlength="80" placeholder="例：〇〇カントリークラブ" value="'+esc(ui.start.courseName)+'"></div>';
 return startHeader()+'<div class="page">'
  +'<div class="card setup-block"><div class="card-title">ラウンド情報</div>'
  +'<div class="field"><div class="label">プレー日</div><div class="setup-help" style="margin:0">'+esc(TODAY())+'（開始日を自動記録）</div></div>'
  +'<div class="field"><div class="label">ホール数</div><div class="segment two"><button class="'+(ui.start.holeCount===18?'active':'')+'" data-action="start-hole-count" data-value="18">18ホール</button><button class="'+(ui.start.holeCount===9?'active':'')+'" data-action="start-hole-count" data-value="9">9ホール</button></div><input type="hidden" id="start-holecount" value="'+ui.start.holeCount+'"></div></div>'
  +'<div class="card setup-block"><div class="card-title">ゴルフ場・コース</div>'
  +'<div class="setup-help">登録済みのゴルフ場を選ぶか、新しいゴルフ場を登録してください。</div>'
  +'<div class="setup-selector"><button class="'+(existing?'active':'')+'" data-action="start-course-mode" data-value="existing" '+(any?'':'disabled')+'>登録済みから選ぶ</button><button class="'+(!existing?'active':'')+'" data-action="start-course-mode" data-value="new">新しいゴルフ場を登録</button></div>'
  +golfField
  +'<div class="setup-grid">'+sectionField('前半コース','frontSection','frontSectionOther')+(ui.start.holeCount===18?sectionField('後半コース','backSection','backSectionOther'):'')+'</div>'
  +(ui.start.holeCount===9?'<p class="setup-caption">9ホールの場合、後半コースは設定不要です。</p>':'')
  +'</div>'
  +'<div class="card setup-block"><div class="card-title">プレー設定</div>'
  +'<div class="setup-grid"><div class="field"><div class="label">使用ティー</div><select class="select" id="start-tee">'+options(tees,ui.start.tee)+'</select>'
  +(ui.start.tee==='その他'?'<input class="input" id="start-tee-other" maxlength="24" value="'+esc(ui.start.teeOther)+'" placeholder="ティー名" style="margin-top:8px">':'')+'</div>'
  +'<div class="field"><div class="label">天気</div><select class="select" id="start-weather">'+options(['晴','曇','雨','雪'],ui.start.weather)+'</select></div></div>'
  +'<div class="field"><div class="label">グリーン（手入力）</div><input class="input" id="start-green" maxlength="30" value="'+esc(ui.start.green)+'" placeholder="例：A / B / ベント"></div></div>'
  +'<div class="section-head"><h2>ホール情報</h2><span>Par / 距離</span></div>'
  +(ui.start.holeCount===18?'<div class="segment two" style="margin-bottom:10px"><button class="'+(half===0?'active':'')+'" data-action="course-half" data-value="0" data-section-tab="front">'+esc(labels[0])+'</button><button class="'+(half===1?'active':'')+'" data-action="course-half" data-value="1" data-section-tab="back">'+esc(labels[1])+'</button></div>':'')
  +'<div class="card">'+holeRows+'</div><button class="primary" data-action="start-round" style="margin-top:16px">この設定で開始</button></div>';
}

function play(){
 const r=currentRound(); if(!r)return home(); const h=currentHole(r); if(!h)return''; const done=h.status==='done';
 const rs=roundStats(r),totalText=rs.holes?`TOTAL ${rs.total} (${scoreLabel(rs.diff)})`:'TOTAL —';
 const holeCard=`<div class="top-hole"><div class="hole-main"><div class="hole-id">${h.number}H</div><div class="hole-meta-wrap"><button class="hole-info-edit" data-action="edit-hole-info">Par${h.par}・${h.distance}yd <span class="hole-edit-mark">✎</span></button></div><div class="hole-side"><div class="hole-total">${totalText}</div>${done?`<div class="hole-result">${holeScore(h)} (${scoreLabel(holeScore(h)-h.par)})・${holePutts(h)} PUTT</div>`:`<div class="hole-remaining">${h.stage==='putt'?`${h.currentPuttRemainingM??'—'}m`:`残り ${Math.round(h.currentRemainingY||0)}yd`}</div>`}</div></div></div>`;
 return`<div class="round-screen"><div class="round-sticky-stack">${roundHeader()}<div class="round-hole-wrap">${holeCard}</div></div><div class="page round-play-body">
 ${h.shots.map((s,i)=>collapsedShot(s,i,h)).join('')}
 ${done?completedHoleView(r,h):h.stage==='putt'?puttInput(r,h):shotInput(r,h)}
 </div></div>`}
function collapsedShot(s,i,h){
 const strokeNo=shotStrokeNumber(h,i);
 const del='<button class="shot-delete-x" data-action="delete-current-shot" data-shot-index="'+i+'" aria-label="'+strokeNo+'打目を削除">×</button>';
 if(s.type==='putt'){
  const lies=(s.puttLie||[]).map(puttLieLabel).filter(Boolean);
  return '<div class="shot-card collapsed" data-action="shot-detail" data-shot="'+i+'" data-hole="'+h.number+'">'+del+'<div class="shot-summary"><span class="shot-num">'+strokeNo+'</span><div class="shot-main"><div class="shot-line">PUTT '+Number(s.puttBeforeM||0).toFixed(1)+'m → '+(s.puttAfterM===0?'Cup-in':Number(s.puttAfterM||0).toFixed(1)+'m')+'</div><div class="shot-mini">'+esc(lies.join('・')||'—')+' · '+esc(s.puttCell||'')+'</div></div><span class="chev">›</span></div></div>';
 }
 return '<div class="shot-card collapsed" data-action="shot-detail" data-shot="'+i+'" data-hole="'+h.number+'">'+del+'<div class="shot-summary"><span class="shot-num">'+strokeNo+'</span><div class="shot-main"><div class="shot-line">'+esc(s.club||'未入力')+' '+(s.shotDistance?Math.round(s.shotDistance)+'yd':'')+'</div><div class="shot-mini">'+esc(shotMetaParts(s).join('・')||'入力なし')+(s.penalty?' · +'+s.penalty:'')+'</div>'+feedbackTagsHtml(s)+'</div><span class="chev">›</span></div></div>';
}
function shotInput(r,h){
 const d=h.draft||shotDraft(); if(!Array.isArray(d.goods))d.goods=[];if(!Array.isArray(d.misses))d.misses=[]; const settings=data.settings; const greenAuto=(h.currentRemainingY||0)<=Number(settings.greenAutoYards||150); if(greenAuto&&d.directionMode==='normal')d.directionMode='green';
 const green=d.directionMode==='green';
 const styles=enabledShotStyles();
 const strokeNo=nextStrokeNumber(h);
 return`<div class="shot-card current"><div class="row"><span class="shot-num">${strokeNo}</span><div><div class="card-title" style="margin:0">${strokeNo}打目を記録</div><div class="tiny muted">空欄でも次打へ進めます</div></div></div>
 <div class="divider"></div><div class="label">クラブ</div><div class="club-grid">${data.settings.clubs.filter(c=>c.clubType!=='putter'&&c.name!=='パター'&&c.name!=='PT').map(c=>`<div class="club-btn tap-choice ${d.club===c.name?'active':''}" data-draft="club" data-value="${esc(c.name)}">${esc(c.name)}</div>`).join('')}</div>
 <div class="divider"></div><div class="row between"><div class="label" style="margin:0">方向</div><div class="segment two" style="width:170px"><div class="tap-choice ${!green?'active':''}" data-draft="directionMode" data-value="normal">通常</div><div class="tap-choice ${green?'active':''}" data-draft="directionMode" data-value="green">グリーン</div></div></div>
 <div style="margin-top:10px">${green?greenDirection(d):normalDirection(d)}</div>
 ${settings.inputs.ballFlight?`<div class="divider"></div><div class="label">球筋</div><div class="grid3">${BALL_FLIGHTS.map(v=>`<div class="chip blue tap-choice ${d.flight===v?'active':''}" data-draft="flight" data-value="${v}">${v}</div>`).join('')}</div>`:''}
 ${styles.length?`<div class="divider"></div><div class="label">打ち方</div><div class="chips">${styles.map(v=>`<div class="chip tap-choice ${d.shotType===v?'active':''}" data-draft="shotType" data-value="${v}">${v}</div>`).join('')}</div>`:''}
 ${settings.inputs.feel?`<div class="divider"></div><div class="label">打感</div><div class="grid3">${FEEL_PRIMARY.map(v=>`<div class="chip tap-choice ${feelArray(d.feel).includes(v)?'active':''}" data-feel="${v}">${v}</div>`).join('')}</div><div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-top:8px">${FEEL_SECONDARY.map(v=>`<div class="chip tap-choice ${feelArray(d.feel).includes(v)?'active':''}" data-feel="${v}">${v}</div>`).join('')}</div>`:''}
 ${enabledFeedback('good').length?`<div class="divider"></div><div class="label">Good</div><div class="chips">${enabledFeedback('good').map(v=>`<div class="chip tap-choice ${d.goods.includes(v)?'active':''}" data-draft-good="${esc(v)}">${esc(v)}</div>`).join('')}</div>`:''}
 ${enabledFeedback('miss').length?`<div class="divider"></div><div class="label">ミス</div><div class="chips">${enabledFeedback('miss').map(v=>`<div class="chip tap-choice ${d.misses.includes(v)?'active':''}" data-draft-miss="${esc(v)}">${esc(v)}</div>`).join('')}</div>`:''}
 ${settings.inputs.slope?`<div class="divider"></div><div class="label">傾斜</div><div class="grid2">${['左足上がり','左足下がり','つま先上がり','つま先下がり'].map(v=>`<div class="chip tap-choice ${slopeArray(d.slope).includes(v)?'active':''}" data-slope="${v}">${v}</div>`).join('')}</div>`:''}
 ${settings.inputs.lie?`<div class="divider"></div><div class="label">ライ</div><div class="chips">${SHOT_LIES.map(v=>`<div class="chip tap-choice ${d.lie===v?'active':''}" data-draft="lie" data-value="${v}">${v}</div>`).join('')}</div>`:''}
 <div class="divider"></div><div class="label">到着地点</div><div class="chips">${SHOT_LANDINGS.map(v=>`<div class="chip tap-choice ${d.landing===v?'active':''}" data-draft="landing" data-value="${v}">${v}</div>`).join('')}</div>
 <div id="shot-penalty-options" ${(d.landing==='OB'||d.landing==='ハザード'||d.landing==='ペナルティ')?'':'hidden'}><div class="label" style="margin-top:12px">罰打</div><div class="grid3">${[1,2,3].map(v=>`<div class="chip tap-choice ${Number(d.penalty)===v?'active':''}" data-draft="penalty" data-value="${v}">+${v}${v===3?'（その他）':''}</div>`).join('')}</div></div>
 <div class="divider"></div><div class="grid2"><div><div class="label">ショット後の残り</div><div class="row"><input class="input" id="remaining-after" type="number" inputmode="decimal" placeholder="例 142" value="${esc(d.remainingAfterY)}"><span class="small muted">yd</span></div></div><div><div class="label">直接飛距離（任意）</div><div class="row"><input class="input" id="direct-distance" type="number" inputmode="decimal" placeholder="例 235" value="${esc(d.directDistance)}"><span class="small muted">yd</span></div></div></div>
 <div class="divider"></div><button class="primary" data-action="save-shot">${d.landing==='Green'?'記録してパットへ':'記録して次のショット'}</button><button class="ghost" style="width:100%;margin-top:9px" data-action="skip-shot">未入力で次のショット</button><button class="header-btn danger" style="width:100%;margin-top:8px" data-action="manual-holeout">ホールアウト</button></div>`}
function normalDirection(d){return`<div class="direction3">${SHOT_DIRECTIONS.map(v=>`<div class="tap-choice ${d.direction===v?'active':''}" data-draft="direction" data-value="${v}">${v}</div>`).join('')}</div>`}
function greenDirection(d){return`<div class="green-grid">${GREEN_CELLS.map(v=>`<div class="tap-choice ${d.greenCell===v?'active':''}" data-draft="greenCell" data-value="${v}">${v}</div>`).join('')}</div>`}
function puttInput(r,h){
 const d=h.puttDraft||puttDraft();d.lie=(d.lie||['フラット']).map(puttLieLabel);
 if(h.currentPuttRemainingM==null){return '<div class="card"><div class="card-title">最初のパット距離</div><div class="card-sub">グリーンオン地点からカップまでの残距離を入力します。</div><div class="quick" style="margin:14px 0">'+PUTT_DISTANCE_PRESETS.map(v=>'<button data-action="set-first-putt" data-value="'+v+'">'+v+'m</button>').join('')+'</div><div class="row"><input class="input" id="first-putt-distance" type="number" inputmode="decimal" step="0.5" placeholder="その他"><span class="small muted">m</span></div><button class="primary" style="margin-top:12px" data-action="set-first-putt-custom">パット入力へ</button></div>'}
 const cells=PUTT_CELLS;

function monthTrendChart(rs){
 const byMonth=new Map();
 rs.forEach(r=>{
  const m=String(r.date||'').match(/^(\d{4})[-/](\d{1,2})(?:[-/]|$)/);
  if(!m||Number(m[2])<1||Number(m[2])>12)return;

 });
 const months=[...byMonth.keys()].sort().map(key=>{

 });

  const pad=Math.max(2,(rawMax-rawMin)*.18),min=Math.max(0,Math.floor(rawMin-pad)),max=Math.ceil(rawMax+pad);
  const bottom=top+92,span=Math.max(1,max-min);

  [0,.5,1].forEach(f=>{

   v+=`<line class="chart-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="3" y="${yy+3}" font-size="9" fill="#667085">${val.toFixed(0)}</text>`;
  });

function stackedChart(rs,st){const W=360,H=230,L=35,R=8,T=22,B=36,max=120;const cw=(W-L-R)/rs.length,bar=cw*.5,clipPrefix='stack-bar-'+uid();let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="スコアとパットの積み上げ棒グラフ">`;[0,40,80,120].forEach(v=>{const y=T+(H-T-B)*(1-v/max);svg+=`<line class="chart-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+4}" font-size="9" fill="#667085">${v}</text>`});st.forEach((s,i)=>{const x=L+cw*i+(cw-bar)/2;const shot=s.total-s.putts;const hShot=(H-T-B)*shot/max,hP=(H-T-B)*s.putts/max,y0=H-B,clipId=clipPrefix+'-'+i;svg+=`<g data-result-id="${rs[i].id}" role="button" aria-label="${esc(rs[i].date)} のラウンド詳細" style="cursor:pointer"><rect x="${x-8}" y="${T}" width="${bar+16}" height="${H-T-8}" fill="transparent"/><defs><clipPath id="${clipId}"><rect x="${x}" y="${y0-hShot-hP}" width="${bar}" height="${hShot+hP}" rx="3"/></clipPath></defs><g clip-path="url(#${clipId})"><rect class="chart-orange" x="${x}" y="${y0-hShot-hP}" width="${bar}" height="${hShot+hP}"/><rect class="chart-blue" x="${x}" y="${y0-hShot-hP}" width="${bar}" height="${hP}"/></g><text x="${x+bar/2}" y="${y0-hShot-hP-7}" text-anchor="middle" font-size="11" font-weight="800" fill="#172033">${s.total}</text><text x="${x+bar/2}" y="${y0-hShot-hP/2+4}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${s.putts}</text><text x="${x+bar/2}" y="${H-13}" text-anchor="middle" font-size="9" fill="#667085">${fmtDate(rs[i].date)}</text></g>`});svg+=`<text x="${W-112}" y="12" font-size="9" fill="#FF6A24">● ショット</text><text x="${W-56}" y="12" font-size="9" fill="#2F6FE4">● PUTT</text></svg>`;return svg}
function lineChart(rs,st){const W=360,H=210,L=38,R=12,T=24,B=34,cw=(W-L-R)/(Math.max(1,rs.length-1));let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="FWとGIRの折れ線グラフ">`;[0,20,40,60,80,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);svg+=`<line class="chart-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+3}" font-size="8" fill="#667085">${v}%</text>`});const pts=(key)=>st.map((s,i)=>[L+cw*i,T+(H-T-B)*(1-s[key]/100)]);const pf=pts('fw'),pg=pts('gir');svg+=`<polyline fill="none" stroke="#FF6A24" stroke-width="2.5" points="${pf.map(p=>p.join(',')).join(' ')}"/><polyline fill="none" stroke="#2F6FE4" stroke-width="2.5" points="${pg.map(p=>p.join(',')).join(' ')}"/>`;st.forEach((s,i)=>{const x=L+cw*i;const yf=pf[i][1],yg=pg[i][1];svg+=`<circle cx="${x}" cy="${yf}" r="4" fill="#FF6A24"/><circle cx="${x}" cy="${yg}" r="4" fill="#2F6FE4"/><text x="${x}" y="${yf-7}" text-anchor="middle" font-size="8" fill="#FF6A24" font-weight="700">${s.fw}%</text><text x="${x}" y="${yg+14}" text-anchor="middle" font-size="8" fill="#2F6FE4" font-weight="700">${s.gir}%</text><text x="${x}" y="${H-11}" text-anchor="middle" font-size="8" fill="#667085">${fmtDate(rs[i].date)}</text>`});svg+=`<text x="${W-92}" y="12" font-size="9" fill="#FF6A24">● FW</text><text x="${W-48}" y="12" font-size="9" fill="#2F6FE4">● GIR</text></svg>`;return svg}

 else if(a==='confirm-holeout'){const sc=Number(document.getElementById('manual-score')?.value||holeComputedScore(currentHole()));mutate(()=>{finalizeHole(currentHole(),sc);ui.modal=null})}
 else if(a==='set-first-putt'){mutate(()=>{currentHole().currentPuttRemainingM=Number(t.dataset.value)})}
 else if(a==='set-first-putt-custom'){const v=Number(document.getElementById('first-putt-distance')?.value);if(v>0)mutate(()=>{currentHole().currentPuttRemainingM=Math.round(v*2)/2})}
 else if(a==='save-putt'){mutate(()=>savePutt())}
 else if(a==='shot-detail'){ui.modal={type:'shotDetail',index:Number(t.dataset.shot),hole:Number(t.dataset.hole||currentHole()?.number)};render()}
 else if(a==='next-hole'){mutate(()=>{const r=currentRound();r.currentHoleIndex=Math.min(r.currentHoleIndex+1,r.holes.length-1);const h=currentHole(r);if(h.currentRemainingY==null)h.currentRemainingY=h.distance;h.stage=h.stage||'shot'})}
 else if(a==='finish-round'){finishRound()}
 else if(a==='json'){const r=roundById(t.dataset.id)||currentRound();if(!r)return;if(completedHoles(r).length<3){toast('JSONは3H終了後から作成できます');return}if(ui.modal?.type==='memo'&&r===currentRound()){const h=currentHole(),memo=document.getElementById('memo-text');if(h&&memo){h.memo=memo.value||'';persist()}}ui.modal={type:'json',json:roundJson(r)};render()}
 else if(a==='copy-json'){copyText(ui.modal?.json||'')}
 else if(a==='close-modal'){ui.modal=null;render()}
 else if(a==='add-club-draft'){if(!ui.clubDraft)ui.clubDraft=clubDraftRows();if(ui.clubDraft.length<14){ui.clubDraft.push({id:uid(),name:'',typical:'',clubType:''});render()}}
 else if(a==='save-clubs'){if(clubDraftValid()){data.settings.clubs=(ui.clubDraft||[]).map(x=>({id:x.id||uid(),name:String(x.name).trim(),typical:Number(x.typical),clubType:x.clubType}));persist();ui.clubDraft=null;ui.prev='settings-clubs';ui.screen='settings';render();toast('クラブ設定を保存しました')}}
 else if(a==='add-style-open'){ui.modal={type:'addStyle'};render()}
 else if(a==='add-style-confirm'){const name=(document.getElementById('custom-style-name')?.value||'').trim();if(name&&ui.styleDraft&&!ui.styleDraft.some(x=>x.label===name)){ui.styleDraft.push({id:'custom-style-'+Date.now(),label:name,enabled:true,custom:true});ui.modal=null;render()}}
 else if(a==='save-styles'){data.settings.shotStyles=JSON.parse(JSON.stringify(ui.styleDraft||[]));persist();ui.styleDraft=null;ui.prev='settings-styles';ui.screen='settings';render();toast('打ち方設定を保存しました')}
 else if(a==='add-feedback-open'){ui.modal={type:'addFeedback'};render()}
 else if(a==='add-feedback-confirm'){const name=(document.getElementById('custom-feedback-name')?.value||'').trim(),type=ui.feedbackTab;if(name&&ui.feedbackDraft&&!ui.feedbackDraft[type].some(x=>x.label===name)){ui.feedbackDraft[type].push({id:'custom-'+type+'-'+Date.now(),label:name,enabled:true,custom:true});ui.modal=null;render()}}
 else if(a==='save-feedback'){data.settings.feedback=JSON.parse(JSON.stringify(ui.feedbackDraft||{good:[],miss:[]}));persist();ui.feedbackDraft=null;ui.prev='settings-feedback';ui.screen='settings';render();toast('Good・ミス設定を保存しました')}
 else if(a==='save-round-setting'){const v=Number(document.getElementById('green-auto')?.value||150);mutate(()=>data.settings.greenAutoYards=clamp(v,20,300));toast('保存しました')}
 else if(a==='clear-samples'){mutate(()=>{data.rounds=data.rounds.filter(r=>!r.sample)});toast('サンプルを削除しました')}
 else if(a==='clear-all'){ui.modal={type:'confirmClear'};render()}
 else if(a==='confirm-discard-active-round'){if(data.activeRound){data.activeRound=null;persist()}ui.modal=null;ui.screen='home';render();toast('途中ラウンドを削除しました')}
 else if(a==='confirm-clear'){localStorage.removeItem(KEY);data=seed();data.rounds=[];data.activeRound=null;ui.modal=null;ui.screen='home';persist();render();toast('データを削除しました')}
}
function applyStartCourse(c){
 const sec=Array.isArray(c.sections)&&c.sections.length>=2?c.sections:['OUT','IN'];
 ui.start.frontSection=['OUT','IN'].includes(sec[0])?sec[0]:'その他';
 ui.start.frontSectionOther=ui.start.frontSection==='その他'?sec[0]:'';
 ui.start.backSection=['OUT','IN'].includes(sec[1])?sec[1]:'その他';
 ui.start.backSectionOther=ui.start.backSection==='その他'?sec[1]:'';
 ui.start.tee=['Back','Regular','Front','Ladies'].includes(c.tee)?c.tee:'その他';
 ui.start.teeOther=ui.start.tee==='その他'?(c.tee||''):'';
}
function onChange(e){const el=e.target;
 if(el.dataset.clubField&&ui.clubDraft){const i=Number(el.dataset.index),row=ui.clubDraft[i];if(!row)return;if(el.dataset.clubField==='type'){row.clubType=el.value;row.name=el.value==='driver'?'Dr':el.value==='putter'?'PT':''}else if(el.dataset.clubField==='name'){row.name=el.value}else if(el.dataset.clubField==='typical'){row.typical=el.value}render();return}
 if(el.id==='start-course'){
  ui.start.courseId=el.value;
  const c=data.courses.find(x=>x.id===ui.start.courseId);
  if(c)applyStartCourse(c);
  ui.courseEditHalf=0;render();return
 }
 if(el.id==='start-front-section'){ui.start.frontSection=el.value;render();return}
 if(el.id==='start-back-section'){ui.start.backSection=el.value;render();return}
 if(el.id==='start-tee'){ui.start.tee=el.value;render();return}
 if(el.id==='start-holecount'){ui.start.holeCount=Number(el.value)||18;render();return}
 if(el.id==='start-weather'){ui.start.weather=el.value;return}
 if(el.classList.contains('hole-par')||el.classList.contains('hole-distance')){saveCourseFields();return}if(el.id==='remaining-after'||el.id==='direct-distance'){const h=currentHole();if(!h)return;if(el.id==='remaining-after')h.draft.remainingAfterY=el.value;else h.draft.directDistance=el.value;persist();return}}

function backTarget(){
 if(ui.screen==='home')return null;
 if(ui.screen==='result')return ui.resultReturnTo||'home';
 if(ui.screen==='scorecard')return ui.scorecardReturnTo||'play';
 const map={howto:'home',start:'home',play:'home',history:'home',data:'home',settings:'home','settings-clubs':'settings','settings-styles':'settings','settings-feedback':'settings','settings-input':'settings','settings-round':'settings','settings-data':'settings','settings-courses':'settings','club-detail':'data','shot-history':'result'};
 return map[ui.screen]||'home';
}
function swipeBack(){
 if(ui.modal){ui.modal=null;render();return}
 if(ui.screen==='home')return;
 if(ui.screen==='result'&&ui.resultFromFinish){ui.prev='result';ui.screen='home';render();return}
 if(historyReady&&history.length>1){history.back();return}
 const target=backTarget();if(!target)return;
 ui.prev=ui.screen;ui.screen=target;render();
}
window.addEventListener('popstate',e=>{
 restoringHistory=true;
 applyHistoryState(e.state);
 render();
 restoringHistory=false;
});
let edgeSwipe=null;
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 const p=e.touches[0];
 // iPhoneで拾いやすいよう、画面左端〜80pxを戻るジェスチャー領域にする。
 // ボトムシート表示中はシート側の下スワイプを優先する。
 if(!document.querySelector('.sheet')&&p.clientX<=80)edgeSwipe={x:p.clientX,y:p.clientY,t:Date.now(),horizontal:false};
 else edgeSwipe=null;
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
 if(!edgeSwipe||e.touches.length!==1)return;
 const p=e.touches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y;
 if(!edgeSwipe.horizontal&&dx>8&&Math.abs(dx)>Math.abs(dy)*1.05)edgeSwipe.horizontal=true;
 if(edgeSwipe.horizontal&&dx>0)e.preventDefault();
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
 if(!edgeSwipe)return;
 const p=e.changedTouches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y,dt=Date.now()-edgeSwipe.t;
 const ok=edgeSwipe.horizontal&&dx>=42&&Math.abs(dy)<=100&&dt<=1200;
 edgeSwipe=null;
 if(ok)swipeBack();
},{passive:true,capture:true});
document.addEventListener('touchcancel',()=>{edgeSwipe=null},{passive:true,capture:true});

// ボトムシートは、シート最上部で下方向へスワイプすると閉じる。
// シート内部の通常スクロールを邪魔しないよう、scrollTop=0のときだけ反応する。
let sheetSwipe=null;
document.addEventListener('touchstart',e=>{
 const sheet=e.target.closest?.('.sheet');
 if(!sheet||e.touches.length!==1||sheet.scrollTop>0||(e.target.closest?.('.hole-sheet-body')?.scrollTop||0)>0){sheetSwipe=null;return}
 const p=e.touches[0];
 sheetSwipe={sheet,x:p.clientX,y:p.clientY,lastY:p.clientY,t:Date.now(),dragging:false};
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
 if(!sheetSwipe||e.touches.length!==1)return;
 const p=e.touches[0],dx=p.clientX-sheetSwipe.x,dy=p.clientY-sheetSwipe.y;
 sheetSwipe.lastY=p.clientY;
 if(!sheetSwipe.dragging&&dy>10&&Math.abs(dy)>Math.abs(dx)*1.15)sheetSwipe.dragging=true;
 if(sheetSwipe.dragging&&dy>0){
   e.preventDefault();
   sheetSwipe.sheet.style.transform=`translateY(${Math.min(dy,140)}px)`;
 }
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
 if(!sheetSwipe)return;
 const p=e.changedTouches[0],dy=p.clientY-sheetSwipe.y,dx=p.clientX-sheetSwipe.x,dt=Date.now()-sheetSwipe.t;
 const sheet=sheetSwipe.sheet,close=sheetSwipe.dragging&&dy>=60&&Math.abs(dx)<=120&&dt<=1200;
 sheet.style.transform='';
 sheetSwipe=null;
 if(close&&ui.modal){ui.modal=null;render()}
},{passive:true,capture:true});
document.addEventListener('touchcancel',()=>{
 if(sheetSwipe?.sheet)sheetSwipe.sheet.style.transform='';
 sheetSwipe=null;
},{passive:true,capture:true});

function onInput(e){const el=e.target;
 if(el.id==='history-search'){ui.historyQuery=el.value;refreshHistoryList();return}
 if(el.dataset.resultMemo!==undefined){const r=roundById(el.dataset.roundId);if(r){r.resultMemo=el.value||'';persist()}return}
 if(el.id==='start-course-name')ui.start.courseName=el.value;
 else if(el.id==='start-front-other'){ui.start.frontSectionOther=el.value;const tab=document.querySelector('[data-section-tab="front"]');if(tab)tab.textContent=el.value.trim()||'その他'}
 else if(el.id==='start-back-other'){ui.start.backSectionOther=el.value;const tab=document.querySelector('[data-section-tab="back"]');if(tab)tab.textContent=el.value.trim()||'その他'}
 else if(el.id==='start-tee-other')ui.start.teeOther=el.value;
 else if(el.id==='start-green')ui.start.green=el.value;
 else if(el.id==='direct-distance'){
  const h=currentHole(),rem=document.getElementById('remaining-after'),raw=String(el.value||'').trim();
  if(h&&rem){
   h.draft.directDistance=raw;
   if(raw!==''){
    const value=Number(raw);
    if(Number.isFinite(value)&&value>=0){const after=remainingAfterShotDistance(h.currentRemainingY,value);rem.value=after;h.draft.remainingAfterY=after}
   }
   persist();
  }
 }
 else if(el.id==='edit-shot-distance'&&ui.modal?.type==='editShot'){
  const r=currentRound(),h=r?.holes.find(x=>x.number===Number(ui.modal.hole)),sh=h?.shots?.[Number(ui.modal.index)],rem=document.getElementById('edit-shot-remaining'),raw=String(el.value||'').trim();
  if(sh&&rem){
   ui.modal.draft.directDistance=raw;
   if(raw!==''){
    const value=Number(raw);
    if(Number.isFinite(value)&&value>=0){const after=remainingAfterShotDistance(sh.remainingBeforeY,value);rem.value=after;ui.modal.draft.remainingAfterY=after}
   }
  }
 }
 else if(el.id==='putt-after-custom'){const h=currentHole(),v=Number(el.value);if(h&&Number.isFinite(v)&&v>=0){h.puttDraft.afterM=Math.round(v*2)/2;persist();syncLivePuttControls()}}
 else if(el.id==='edit-putt-after-custom'&&ui.modal?.type==='editShot'){const v=Number(el.value);if(Number.isFinite(v)&&v>=0)ui.modal.draft.afterM=Math.round(v*2)/2}
}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);
render();
})();
</script>
