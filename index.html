<title>Shot log</title>
<style>

.home-howto:active{background:#E1ECFF}

.field{margin-bottom:14px}.label{font-size:13px;font-weight:700;margin-bottom:7px}.input,.select,.textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:14px;min-height:48px;padding:10px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,228,.08)}.textarea{min-height:110px;resize:vertical}
.segment{display:grid;background:var(--soft);padding:3px;border-radius:14px;gap:3px}.segment.two{grid-template-columns:1fr 1fr}.segment.four{grid-template-columns:repeat(4,1fr)}.segment button{border:0;background:transparent;border-radius:11px;min-height:40px;font-weight:700;color:var(--sub);font-size:13px}.segment button.active{background:var(--orange);color:#fff;box-shadow:0 2px 7px rgba(255,106,36,.16)}

.club-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.club-btn{border:1px solid var(--border);background:#fff;border-radius:14px;min-height:46px;font-weight:750}.club-btn.active{border-color:var(--orange);background:var(--orange-soft);color:#B8460D}
.top-hole{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:12px;position:sticky;top:67px;z-index:14}.hole-main{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.hole-id{font-size:24px;font-weight:850}.hole-meta{font-size:13px;color:var(--sub)}.hole-result{font-weight:800;color:var(--orange);font-size:14px}
.shot-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}.shot-card.collapsed{padding:12px 14px}.shot-summary{display:flex;align-items:center;justify-content:space-between;gap:8px}.shot-num{width:30px;height:30px;border-radius:50%;background:#EAF2FF;color:#2F6FE4;display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto}.shot-main{flex:1;min-width:0}.shot-line{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot-mini{font-size:11px;color:var(--sub);margin-top:3px}.shot-card.current{padding:15px;border:1px solid rgba(255,106,36,.28)}
.divider{height:1px;background:#EEF1F4;margin:14px 0}.muted{color:var(--sub)}.tiny{font-size:11px}.small{font-size:12px}.center{text-align:center}
.direction3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.direction3 button,.green-grid button{border:1px solid var(--border);background:#fff;border-radius:12px;min-height:46px;font-size:12px;font-weight:700}.direction3 button.active,.green-grid button.active{background:var(--orange-soft);border-color:var(--orange);color:#B8460D}.green-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.green-grid button{min-height:50px}.green-grid button.cup{background:#F6FBF8}
.quick{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.quick button{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:13px;min-height:40px;padding:0 13px;font-weight:700}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}.stepper button{border:0;background:var(--soft);border-radius:13px;min-height:46px;font-size:22px;font-weight:600}.stepper .step-val{min-height:46px;border:1px solid var(--border);border-radius:13px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.score-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}.score-table{border-collapse:separate;border-spacing:0;min-width:980px;width:100%;font-size:12px}.score-table th,.score-table td{border-right:1px solid #EEF1F4;border-bottom:1px solid #EEF1F4;text-align:center;min-width:44px;height:38px;padding:4px}.score-table th:first-child,.score-table td:first-child{position:sticky;left:0;background:#fff;z-index:3;min-width:86px;text-align:left;padding-left:10px;font-weight:700}.score-table thead th{background:var(--orange);color:#fff;font-weight:800}.score-table thead th.total-col{background:var(--blue)}.score-table thead th:first-child{background:#fff;color:var(--text)}.score-table .score-good{background:#FFF1E9;color:#B8460D;font-weight:800}.score-table .score-bad{background:#F7F8FA;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:750;background:var(--soft);color:var(--sub)}.badge.orange{background:var(--orange-soft);color:#B8460D}.badge.blue{background:var(--blue-soft);color:#1E57B6}.badge.green{background:#ECFDF5;color:#047857}
.progress{height:10px;background:#EEF1F4;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--orange);border-radius:999px}.bar-3{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#EEF1F4}.bar-3 span:nth-child(1){background:#A9C7FF}.bar-3 span:nth-child(2){background:var(--orange)}.bar-3 span:nth-child(3){background:#7BB1FF}
.bar-flight{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#EEF1F4}.bar-flight span:nth-child(1){background:#FF9B7A}.bar-flight span:nth-child(2){background:#F5B252}.bar-flight span:nth-child(3){background:var(--blue)}
.stat-legend{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px;margin-top:8px}.stat-legend strong{display:block;font-size:17px}.stat-legend span{font-size:10px;color:var(--sub)}
.bar-row{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:8px;margin:9px 0;font-size:12px}.bar-track{height:10px;background:#EEF1F4;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--orange);border-radius:99px}
.chart{width:100%;height:auto;display:block}.chart text{font-family:inherit}.chart-grid{stroke:#E8EDF3;stroke-width:1}.chart-axis{stroke:#C9D1DC;stroke-width:1}.chart-orange{fill:var(--orange);stroke:var(--orange)}.chart-blue{fill:var(--blue);stroke:var(--blue)}
.tabline{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.tabline button{border:0;background:#fff;min-height:44px;font-size:12px;font-weight:700;color:var(--sub)}.tabline button.active{background:var(--orange);color:#fff}
.setting-row{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-bottom:1px solid #EEF1F4;gap:12px}.setting-row:last-child{border-bottom:0}.switch{width:48px;height:28px;border-radius:999px;background:#D9DEE6;padding:3px;border:0;position:relative;flex:0 0 auto}.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.14);transition:.18s}.switch.on{background:var(--orange)}.switch.on::after{left:23px}
.modal-back{position:fixed;inset:0;background:rgba(18,25,38,.38);z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.15)}.sheet-handle{width:44px;height:5px;border-radius:99px;background:#CED5DE;margin:2px auto 14px}.modal-card{width:calc(100% - 32px);max-width:398px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 18px 54px rgba(0,0,0,.20);align-self:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#172033;color:#fff;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:700;z-index:150;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{padding:34px 16px;text-align:center;color:var(--sub);font-size:13px}
.code-preview{width:100%;min-height:300px;max-height:55vh;overflow:auto;background:#111827;color:#D1D5DB;border-radius:14px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.note{background:var(--blue-soft);border-radius:14px;padding:12px;color:#315A9E;font-size:12px;line-height:1.55}
@media (orientation:landscape) and (min-width:700px){.shell{max-width:100%;}.score-table{min-width:100%;font-size:11px}.nav{max-width:100%}}
</style>

<body><div id="app"></div>
<script>
(() => {
'use strict';
const KEY='shot-log:v1:data';
const TODAY=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const pct=(n,d)=>d?Math.round(n/d*100):0;
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const avg=a=>a.length?sum(a)/a.length:0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`};
const scoreLabel=d=>d===0?'E':d>0?`+${d}`:`${d}`;

function defaultSettings(){return{
  clubs:['1W','5W','3U','4U','5I','6I','7I','8I','9I','PW','48°','52°','58°','パター'].map((name,i)=>({id:uid(),name,typical:[225,195,188,180,165,155,145,135,120,100,85,65,45,0][i]})),
  inputs:{goodMiss:true,ballFlight:true,feel:false,shotType:false,slope:false,lie:false,pin:false,penaltyDetails:true},
  options:{good:['Good'],miss:['ダフリ','トップ','フェース開き','シャンク','力んだ','突っ込み'],feel:['良い','普通','薄い','ダフリ','トップ','ヒール','トゥ'],shotType:['ライン出し','フルスイング','バニラ','ロブ','スティンガー']},
  greenAutoYards:150
}}
function defaultCourse(){
  const pars=[4,4,3,5,4,4,3,5,4,4,3,4,5,4,4,3,5,4];
  const ds=[385,402,165,515,372,410,148,532,398,401,177,356,505,392,418,154,540,380];
  return {id:uid(),name:'サンプルゴルフクラブ',tee:'Regular',sections:['OUT','IN'],holes:pars.map((par,i)=>({number:i+1,par,distance:ds[i]}))};
}
function sampleRound(date,scoreTarget,puttTarget,index){
  const c=defaultCourse(); const holes=[]; let scoreLeft=scoreTarget,puttLeft=puttTarget;
  for(let i=0;i<18;i++){
    const base=c.holes[i]; const remaining=18-i;
    let score=i===17?scoreLeft:clamp(Math.round(scoreLeft/remaining),base.par-1,base.par+3); scoreLeft-=score;
    let putts=i===17?puttLeft:clamp(Math.round(puttLeft/remaining),1,3); puttLeft-=putts;
    const nonPutts=Math.max(1,score-putts); const shots=[];
    for(let s=0;s<nonPutts;s++){
      const clubs=['1W','7I','8I','PW','52°']; const club=s===0&&base.par>3?'1W':clubs[(i+s+index)%clubs.length];
      const dir=['左','中央','右'][(i+s+index)%3]; const flight=['ドロー','ストレート','フェード'][(i+2*s+index)%3];
      const good=((i+s+index)%4)!==0; const typical=(defaultSettings().clubs.find(x=>x.name===club)||{}).typical||120;
      shots.push({id:uid(),type:'shot',num:shots.length+1,club,direction:dir,directionMode:'normal',greenCell:'',flight,quality:good?'Good':'ミス',misses:good?[]:[['ダフリ','トップ','フェース開き'][(i+s)%3]],landing:s===nonPutts-1?'Green':(s===0&&base.par>3?((i+index)%3===0?'ラフ':'FW'):'ラフ'),remainingBeforeY:Math.max(0,base.distance-s*typical),remainingAfterY:Math.max(0,base.distance-(s+1)*typical),shotDistance:typical+(((i+s)%5)-2)*5,estimatedDistance:true,penalty:(i+index===7&&s===0)?1:0});
    }
    let before=3.5+((i+index)%4)*.5;
    for(let p=0;p<putts;p++){
      const last=p===putts-1; const after=last?0:Math.max(.5,before-(1+((i+p)%3)*.5));
      shots.push({id:uid(),type:'putt',num:shots.length+1,puttBeforeM:before,puttAfterM:after,puttLie:['Flat'],puttCell:last?'Cup-in':['左','手前','右'][(i+p)%3]}); before=after;
    }
    holes.push({number:i+1,par:base.par,distance:base.distance,pin:'中央',memo:(i===3?`4H: ${index%2?'右サイド注意。':'奥から速い。'}`:''),shots,status:'done',score,stage:'done',currentRemainingY:0,currentPuttRemainingM:0,draft:shotDraft(),puttDraft:puttDraft()});
  }
  return {id:uid(),sample:true,date,courseName:'サンプルゴルフクラブ',section:'OUT / IN',tee:'Regular',weather:'晴',green:'A',holeCount:18,holes,currentHoleIndex:17,startedAt:date+'T08:00:00',completedAt:date+'T13:00:00'};
}
function seed(){
 const settings=defaultSettings(); const course=defaultCourse();
 const dates=['2026-08-15','2026-08-30','2026-09-14','2026-09-28','2026-10-03'];
 const scores=[94,92,89,93,91], putts=[32,31,29,33,32];
 return {version:1,settings,courses:[course],rounds:dates.map((d,i)=>sampleRound(d,scores[i],putts[i],i)),activeRound:null};
}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.version?mergeData(v):seed()}catch(e){return seed()}}
function mergeData(v){const s=defaultSettings();return{version:1,settings:{...s,...(v.settings||{}),inputs:{...s.inputs,...(v.settings?.inputs||{})},options:{...s.options,...(v.settings?.options||{})}},courses:Array.isArray(v.courses)?v.courses:[],rounds:Array.isArray(v.rounds)?v.rounds:[],activeRound:v.activeRound||null}}
let data=load();
let ui={screen:'home',prev:'home',dataTab:'recent',settingsScreen:null,viewRoundId:null,scorecardRoundId:null,modal:null,toast:'',start:{courseId:data.courses[0]?.id||'',courseName:'',section:'OUT / IN',tee:'Regular',weather:'晴',green:'A',holeCount:18},courseEditHalf:0,clubId:null};
let lastRenderedScreen=ui.screen;
let historyReady=false;
let restoringHistory=false;
function historyState(){return{shotlog:true,screen:ui.screen,prev:ui.prev,dataTab:ui.dataTab,viewRoundId:ui.viewRoundId,scorecardRoundId:ui.scorecardRoundId,clubId:ui.clubId}}
function applyHistoryState(s){
 if(!s||!s.shotlog){ui.screen='home';ui.prev='home';ui.modal=null;return}
 ui.screen=s.screen||'home';ui.prev=s.prev||'home';ui.dataTab=s.dataTab||ui.dataTab;ui.viewRoundId=s.viewRoundId||null;ui.scorecardRoundId=s.scorecardRoundId||null;ui.clubId=s.clubId||null;ui.modal=null;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function mutate(fn){fn();persist();render()}
function toast(msg){ui.toast=msg;render();setTimeout(()=>{ui.toast='';render()},1500)}
function shotDraft(){return{club:'',directionMode:'normal',direction:'中央',greenCell:'中央',flight:'ストレート',quality:'Good',misses:[],landing:'FW',remainingAfterY:'',directDistance:'',feel:'',shotType:'',slope:'',lie:'',penalty:0}}
function puttDraft(){return{lie:['Flat'],cell:'手前',afterM:1}}
function createRoundFromStart(){
 const sel=data.courses.find(c=>c.id===ui.start.courseId); let name=(sel?.name||ui.start.courseName||'未登録コース').trim(); const tee=ui.start.tee;
 let course=sel;
 if(!course || course.name!==name || course.tee!==tee){
   const base=sel||defaultCourse(); course={id:uid(),name,tee,sections:['OUT','IN'],holes:base.holes.map(h=>({...h}))}; data.courses.push(course);
 }

 ${data.settings.inputs.goodMiss?`<div class="card"><div class="card-title">Good / ミス</div><div class="grid2"><div class="metric"><div class="metric-label">Good</div><div class="metric-value orange">${pct(good,good+miss)}%</div></div><div class="metric"><div class="metric-label">ミス</div><div class="metric-value blue">${pct(miss,good+miss)}%</div></div></div><div class="divider"></div>${Object.entries(misses).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,Math.max(...Object.values(misses),1))).join('')||'<div class="small muted">ミス内訳なし</div>'}</div>`:''}
 <div class="card"><div class="card-title">コースメモ</div>${notes.length?notes.map(n=>`<div class="small" style="padding:8px 0;border-bottom:1px solid #EEF1F4">${esc(n)}</div>`).join(''):'<div class="small muted">メモはありません。</div>'}</div>

function stackedChart(rs,st){const W=360,H=230,L=35,R=8,T=22,B=36,max=120;const cw=(W-L-R)/rs.length,bar=cw*.5;let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="スコアとパットの積み上げ棒グラフ">`;[0,40,80,120].forEach(v=>{const y=T+(H-T-B)*(1-v/max);svg+=`<line class="chart-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+4}" font-size="9" fill="#667085">${v}</text>`});st.forEach((s,i)=>{const x=L+cw*i+(cw-bar)/2;const shot=s.total-s.putts;const hShot=(H-T-B)*shot/max,hP=(H-T-B)*s.putts/max,y0=H-B;svg+=`<g data-result-id="${rs[i].id}" role="button" aria-label="${esc(rs[i].date)} のラウンド詳細" style="cursor:pointer"><rect x="${x-8}" y="${T}" width="${bar+16}" height="${H-T-8}" fill="transparent"/><rect class="chart-orange" x="${x}" y="${y0-hShot}" width="${bar}" height="${hShot}" rx="3"/><rect class="chart-blue" x="${x}" y="${y0-hShot-hP}" width="${bar}" height="${hP}" rx="3"/><text x="${x+bar/2}" y="${y0-hShot-hP-7}" text-anchor="middle" font-size="11" font-weight="800" fill="#172033">${s.total}</text><text x="${x+bar/2}" y="${y0-hShot-hP/2+4}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${s.putts}</text><text x="${x+bar/2}" y="${H-13}" text-anchor="middle" font-size="9" fill="#667085">${fmtDate(rs[i].date)}</text></g>`});svg+=`<text x="${W-112}" y="12" font-size="9" fill="#FF6A24">● ショット</text><text x="${W-56}" y="12" font-size="9" fill="#2F6FE4">● PUTT</text></svg>`;return svg}
function lineChart(rs,st){const W=360,H=210,L=38,R=12,T=24,B=34,cw=(W-L-R)/(Math.max(1,rs.length-1));let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="FWとGIRの折れ線グラフ">`;[0,20,40,60,80,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);svg+=`<line class="chart-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+3}" font-size="8" fill="#667085">${v}%</text>`});const pts=(key)=>st.map((s,i)=>[L+cw*i,T+(H-T-B)*(1-s[key]/100)]);const pf=pts('fw'),pg=pts('gir');svg+=`<polyline fill="none" stroke="#FF6A24" stroke-width="2.5" points="${pf.map(p=>p.join(',')).join(' ')}"/><polyline fill="none" stroke="#2F6FE4" stroke-width="2.5" points="${pg.map(p=>p.join(',')).join(' ')}"/>`;st.forEach((s,i)=>{const x=L+cw*i;const yf=pf[i][1],yg=pg[i][1];svg+=`<circle cx="${x}" cy="${yf}" r="4" fill="#FF6A24"/><circle cx="${x}" cy="${yg}" r="4" fill="#2F6FE4"/><text x="${x}" y="${yf-7}" text-anchor="middle" font-size="8" fill="#FF6A24" font-weight="700">${s.fw}%</text><text x="${x}" y="${yg+14}" text-anchor="middle" font-size="8" fill="#2F6FE4" font-weight="700">${s.gir}%</text><text x="${x}" y="${H-11}" text-anchor="middle" font-size="8" fill="#667085">${fmtDate(rs[i].date)}</text>`});svg+=`<text x="${W-92}" y="12" font-size="9" fill="#FF6A24">● FW</text><text x="${W-48}" y="12" font-size="9" fill="#2F6FE4">● GIR</text></svg>`;return svg}

function clubDetail(){const c=data.settings.clubs.find(x=>x.id===ui.clubId);if(!c)return'';const shots=data.rounds.flatMap(r=>roundStats(r).allShots).filter(s=>s.club===c.name),ds=shots.map(s=>Number(s.shotDistance)).filter(Boolean);const dir=freq(shots,x=>x.directionMode==='green'?mapGreenToLR(x.greenCell):x.direction,['左','中央','右']);const fl=freq(shots,'flight',['ドロー','ストレート','フェード']);const good=shots.filter(x=>x.quality==='Good').length,miss=shots.filter(x=>x.quality==='ミス').length;const misses={};shots.flatMap(x=>x.misses||[]).forEach(m=>misses[m]=(misses[m]||0)+1);return`${header(c.name+' の分析','data')}<div class="page"><div class="card"><div class="card-title">距離</div><div class="grid2"><div class="metric"><div class="metric-label">平均</div><div class="metric-value">${ds.length?Math.round(avg(ds))+'y':'—'}</div></div><div class="metric"><div class="metric-label">使用回数</div><div class="metric-value">${shots.length}</div></div><div class="metric"><div class="metric-label">最大</div><div class="metric-value">${ds.length?Math.max(...ds)+'y':'—'}</div></div><div class="metric"><div class="metric-label">最小</div><div class="metric-value">${ds.length?Math.min(...ds)+'y':'—'}</div></div></div>${distanceBins(ds)}</div><div class="card"><div class="card-title">方向</div>${threeBar('',dir,['左','中央','右'],'dir')}</div><div class="card"><div class="card-title">球筋</div>${threeBar('',fl,['ドロー','ストレート','フェード'],'flight')}</div>${data.settings.inputs.goodMiss?`<div class="card"><div class="card-title">Good / ミス</div><div class="grid2"><div class="metric"><div class="metric-label">Good</div><div class="metric-value orange">${pct(good,good+miss)}%</div></div><div class="metric"><div class="metric-label">ミス</div><div class="metric-value blue">${pct(miss,good+miss)}%</div></div></div><div class="divider"></div>${Object.entries(misses).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,Math.max(...Object.values(misses),1))).join('')||'<div class="small muted">ミス内訳なし</div>'}</div>`:''}</div>`}
function distanceBins(ds){if(!ds.length)return'<div class="empty">距離データなし</div>';const min=Math.floor(Math.min(...ds)/10)*10,max=Math.ceil(Math.max(...ds)/10)*10;const bins=[];for(let x=min;x<=max;x+=10){bins.push([`${x}–${x+9}`,ds.filter(v=>v>=x&&v<x+10).length])}const m=Math.max(...bins.map(x=>x[1]),1);return`<div class="divider"></div><div class="label">距離の分布</div>${bins.map(([k,v])=>barRow(k,v,m)).join('')}`}

function settingsInput(){const inp=data.settings.inputs;const rows=[['goodMiss','Good / ミス'],['ballFlight','球筋'],['feel','打感'],['shotType','打ち方'],['slope','傾斜'],['lie','ライ'],['pin','ピン位置'],['penaltyDetails','ペナルティ詳細']];return`${header('ショット入力設定','settings')}<div class="page"><div class="card"><div class="card-title">表示する項目</div>${rows.map(([k,l])=>`<div class="setting-row"><div><strong>${l}</strong></div><button class="switch ${inp[k]?'on':''}" data-toggle-input="${k}"></button></div>`).join('')}</div><div class="card"><div class="card-title">ミスの選択肢</div><div class="chips">${data.settings.options.miss.map(v=>`<button class="chip" data-remove-miss="${esc(v)}">${esc(v)} ×</button>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="new-miss" placeholder="項目を追加"><button class="ghost" data-action="add-miss">追加</button></div></div></div>`}
function settingsRound(){return`${header('ラウンド設定','settings')}<div class="page"><div class="card"><div class="card-title">グリーン狙い自動切替距離</div><div class="card-sub">残り距離が設定値以下のとき、方向入力を9マスで開きます。プレー中に手動切替もできます。</div><div class="row" style="margin-top:14px"><input class="input" id="green-auto" type="number" inputmode="numeric" value="${data.settings.greenAutoYards}"><span class="small muted">yd</span><button class="ghost" data-action="save-round-setting">保存</button></div></div><div class="note">距離はヤード、パットはメートル（0.5m刻み）で固定しています。</div></div>`}
function settingsData(){return`${header('データ管理','settings')}<div class="page"><div class="list"><div class="list-item"><div><div class="list-title">保存済みコース</div><div class="list-sub">登録コースを端末内に保存</div></div><strong>${data.courses.length}</strong></div><div class="list-item"><div><div class="list-title">ラウンドデータ</div><div class="list-sub">完了済みラウンド</div></div><strong>${data.rounds.length}</strong></div><div class="list-item"><div><div class="list-title">JSON</div><div class="list-sub">ラウンド結果からプレビュー→コピー</div></div><span class="badge blue">COPY</span></div></div><button class="secondary danger" style="margin-top:16px" data-action="clear-samples">サンプルデータだけ削除</button><button class="secondary danger" style="margin-top:10px" data-action="clear-all">全データ削除</button></div>`}
function modal(){if(!ui.modal)return'';const m=ui.modal;if(m.type==='memo'){const h=currentHole();return`<div class="modal-back"><div class="sheet"><div class="sheet-handle"></div><div class="card-title">${h.number}H コースメモ</div><div class="card-sub">気づき・反省・次回の狙いなどを自由に記録します。</div><textarea class="textarea" id="memo-text" style="margin-top:12px">${esc(h.memo)}</textarea><button class="primary" style="margin-top:10px" data-action="save-memo">保存</button><button class="header-btn" style="width:100%;margin-top:6px" data-action="close-modal">閉じる</button></div></div>`}
 if(m.type==='holeSheet'){const r=roundById(m.roundId)||currentRound(),h=r.holes.find(x=>x.number===m.hole);return`<div class="modal-back"><div class="sheet"><div class="sheet-handle"></div><div class="row between"><div><div class="card-title" style="margin:0">${h.number}H · Par${h.par} · ${h.distance}yd</div><div class="small muted">Score ${holeScore(h)??'—'} · ${holePutts(h)} PUTT</div></div><button class="header-btn" data-action="close-modal">閉じる</button></div><div style="margin-top:14px">${h.shots.length?h.shots.map((s,i)=>`<div class="shot-card collapsed"><div class="shot-summary"><span class="shot-num">${i+1}</span><div class="shot-main"><div class="shot-line">${s.type==='putt'?`PUTT ${s.puttBeforeM}m → ${s.puttAfterM===0?'Cup-in':s.puttAfterM+'m'}`:`${esc(s.club||'未入力')} ${s.shotDistance?Math.round(s.shotDistance)+'yd':''}`}</div><div class="shot-mini">${s.type==='putt'?esc((s.puttLie||[]).join(' / ')):`${esc(s.direction||s.greenCell||'')} · ${esc(s.flight||'')} · ${esc(s.landing||'')}`}</div></div>${r===data.activeRound?`<button class="header-btn danger" data-delete-shot="${i}" data-hole="${h.number}">削除</button>`:''}</div></div>`).join(''):'<div class="empty">ショット記録なし</div>'}</div>${r===data.activeRound?`<button class="primary" data-edit-hole="${h.number}">このホールを編集</button>`:''}</div></div>`}
 if(m.type==='shotDetail'){const h=currentHole(),s=h.shots[m.index];return`<div class="modal-back"><div class="sheet"><div class="sheet-handle"></div><div class="card-title">${m.index+1}打目 詳細</div>${s.type==='putt'?`<div class="list"><div class="list-item"><span>残距離</span><strong>${s.puttBeforeM}m → ${s.puttAfterM===0?'Cup-in':s.puttAfterM+'m'}</strong></div><div class="list-item"><span>ライ</span><strong>${esc((s.puttLie||[]).join(' / '))}</strong></div></div>`:`<div class="list">${[['クラブ',s.club],['方向',s.directionMode==='green'?s.greenCell:s.direction],['球筋',s.flight],['Good / ミス',s.quality],['到着地点',s.landing],['飛距離',s.shotDistance?Math.round(s.shotDistance)+'yd':'—'],['罰打',s.penalty?`+${s.penalty}`:'—']].map(([a,b])=>`<div class="list-item"><span>${a}</span><strong>${esc(b||'—')}</strong></div>`).join('')}</div>`}<button class="header-btn" style="width:100%;margin-top:12px" data-action="close-modal">閉じる</button></div></div>`}
 if(m.type==='manualHoleout'){const h=currentHole();return`<div class="modal-back"><div class="modal-card"><div class="card-title">スコアを確定</div><div class="card-sub">記録からの計算は ${holeComputedScore(h)} 打です。実スコアが異なる場合だけ変更してください。</div><input class="input" id="manual-score" type="number" inputmode="numeric" value="${holeComputedScore(h)>0?holeComputedScore(h):h.par}" style="margin:14px 0"><button class="primary" data-action="confirm-holeout">確定</button><button class="header-btn" style="width:100%;margin-top:6px" data-action="close-modal">キャンセル</button></div></div>`}
 if(m.type==='json'){return`<div class="modal-back"><div class="sheet"><div class="sheet-handle"></div><div class="card-title">JSONプレビュー</div><pre class="code-preview">${esc(m.json)}</pre><button class="primary" style="margin-top:12px" data-action="copy-json">JSONをコピー</button><button class="header-btn" style="width:100%;margin-top:6px" data-action="close-modal">閉じる</button></div></div>`}
 if(m.type==='confirmClear'){return`<div class="modal-back"><div class="modal-card"><div class="card-title danger">全データを削除しますか？</div><div class="card-sub">コース、ラウンド、設定を端末から削除します。この操作は取り消せません。</div><button class="primary" style="background:var(--error);margin-top:16px" data-action="confirm-clear">全データを削除</button><button class="header-btn" style="width:100%;margin-top:6px" data-action="close-modal">キャンセル</button></div></div>`}
 return''}

function readStartForm(){ui.start.courseId=document.getElementById('start-course')?.value||'';ui.start.courseName=document.getElementById('start-course-name')?.value||'';ui.start.section=document.getElementById('start-section')?.value||'OUT / IN';ui.start.tee=document.getElementById('start-tee')?.value||'Regular';ui.start.weather=document.getElementById('start-weather')?.value||'晴';ui.start.green=document.getElementById('start-green')?.value||'';ui.start.holeCount=Number(document.getElementById('start-holecount')?.value||18)}
function saveCourseFields(){const c=data.courses.find(x=>x.id===ui.start.courseId);if(!c)return;document.querySelectorAll('.hole-par').forEach(el=>{const h=c.holes.find(x=>x.number===Number(el.dataset.hole));if(h)h.par=Number(el.value)});document.querySelectorAll('.hole-distance').forEach(el=>{const h=c.holes.find(x=>x.number===Number(el.dataset.hole));if(h)h.distance=Number(el.value)||h.distance});persist()}
function saveShot(skip=false){const r=currentRound(),h=currentHole(r),d=h.draft||shotDraft();const remEl=document.getElementById('remaining-after'),distEl=document.getElementById('direct-distance');if(remEl)d.remainingAfterY=remEl.value;if(distEl)d.directDistance=distEl.value;const before=Number(h.currentRemainingY||0),after=d.remainingAfterY===''?before:Number(d.remainingAfterY);const direct=Number(d.directDistance);const estimated=Math.max(0,before-after);const s={id:uid(),type:'shot',num:h.shots.length+1,club:skip?'':d.club,directionMode:d.directionMode,direction:skip?'':d.direction,greenCell:skip?'':d.greenCell,flight:skip?'':d.flight,quality:skip?'':d.quality,misses:skip?[]:[...d.misses],feel:d.feel,shotType:d.shotType,slope:d.slope,lie:d.lie,landing:skip?'':d.landing,remainingBeforeY:before,remainingAfterY:after,shotDistance:direct||estimated||null,estimatedDistance:!direct,penalty:skip?0:Number(d.penalty||0)};h.shots.push(s);if(d.remainingAfterY!=='')h.currentRemainingY=after;if(!skip&&d.landing==='Green'){h.stage='putt';h.currentRemainingY=0;h.currentPuttRemainingM=null}h.draft=shotDraft()}
function savePutt(){const h=currentHole(),d=h.puttDraft;const cup=d.cell==='Cup-in';const after=cup?0:Number(d.afterM||0);h.shots.push({id:uid(),type:'putt',num:h.shots.length+1,puttBeforeM:Number(h.currentPuttRemainingM||0),puttAfterM:after,puttLie:[...d.lie],puttCell:d.cell});h.currentPuttRemainingM=after;h.puttDraft=puttDraft();if(cup)finalizeHole(h,holeComputedScore(h))}
function finalizeHole(h,score){h.status='done';h.stage='done';h.score=Number(score);h.currentRemainingY=0;h.currentPuttRemainingM=0}
function finishRound(){const r=currentRound();r.completedAt=new Date().toISOString();data.rounds.push(r);data.activeRound=null;ui.viewRoundId=r.id;ui.prev='home';ui.screen='result';persist();render()}
function roundJson(r){return JSON.stringify({app:'Shot log',version:1,generatedAt:new Date().toISOString(),round:{id:r.id,date:r.date,courseName:r.courseName,section:r.section,tee:r.tee,weather:r.weather,green:r.green,holeCount:r.holeCount,stats:roundStats(r),holes:r.holes.map(h=>({number:h.number,par:h.par,distance:h.distance,pin:h.pin,memo:h.memo,score:holeScore(h),shots:h.shots}))}},null,2)}

function onClick(e){const t=e.target.closest('button,[data-result-id],[data-hole-sheet],[data-club-detail],[data-edit-hole],[data-delete-shot]');if(!t)return;
 if(t.dataset.nav){ui.prev=ui.screen;ui.screen=t.dataset.nav;render();return} if(t.dataset.go){ui.prev=ui.screen;ui.screen=t.dataset.go;render();return}
 if(t.dataset.resultId){ui.prev=ui.screen;ui.viewRoundId=t.dataset.resultId;ui.screen='result';render();return}
 if(t.dataset.dataTab){ui.dataTab=t.dataset.dataTab;render();return}
 if(t.dataset.clubDetail){ui.clubId=t.dataset.clubDetail;ui.screen='club-detail';render();return}
 if(t.dataset.draft){mutate(()=>{const h=currentHole(),d=h.draft;if(t.dataset.draft==='penalty')d.penalty=Number(t.dataset.value);else d[t.dataset.draft]=t.dataset.value});return}
 if(t.dataset.draftMiss){mutate(()=>{const d=currentHole().draft,v=t.dataset.draftMiss;d.misses=d.misses.includes(v)?d.misses.filter(x=>x!==v):[...d.misses,v]});return}
 if(t.dataset.puttLie){mutate(()=>{const d=currentHole().puttDraft,v=t.dataset.puttLie;if(v==='Flat')d.lie=['Flat'];else{d.lie=d.lie.filter(x=>x!=='Flat');d.lie=d.lie.includes(v)?d.lie.filter(x=>x!==v):[...d.lie,v];if(!d.lie.length)d.lie=['Flat']}});return}
 if(t.dataset.puttCell){mutate(()=>{currentHole().puttDraft.cell=t.dataset.puttCell});return}
 if(t.dataset.puttAfter){mutate(()=>{currentHole().puttDraft.afterM=Number(t.dataset.puttAfter)});return}
 if(t.dataset.holeSheet){const r=roundById(ui.scorecardRoundId)||currentRound();ui.modal={type:'holeSheet',roundId:r.id,hole:Number(t.dataset.holeSheet)};render();return}
 if(t.dataset.editHole){const r=currentRound(),idx=r.holes.findIndex(h=>h.number===Number(t.dataset.editHole));if(idx>=0)mutate(()=>{const h=r.holes[idx];h.status='open';h.score=null;h.stage=h.shots.some(s=>s.type==='putt')?'putt':'shot';r.currentHoleIndex=idx;ui.modal=null;ui.screen='play'});return}
 if(t.dataset.deleteShot!==undefined){mutate(()=>{const h=currentRound().holes.find(x=>x.number===Number(t.dataset.hole));h.shots.splice(Number(t.dataset.deleteShot),1);h.score=h.status==='done'?holeComputedScore(h):h.score;ui.modal={type:'holeSheet',roundId:currentRound().id,hole:h.number}});return}
 if(t.dataset.clubMove){mutate(()=>{const a=data.settings.clubs,i=a.findIndex(x=>x.id===t.dataset.clubMove),j=clamp(i+Number(t.dataset.dir),0,a.length-1);if(i>=0&&i!==j){const [x]=a.splice(i,1);a.splice(j,0,x)}});return}
 if(t.dataset.clubDelete){mutate(()=>{data.settings.clubs=data.settings.clubs.filter(x=>x.id!==t.dataset.clubDelete)});return}
 if(t.dataset.toggleInput){mutate(()=>{const k=t.dataset.toggleInput;data.settings.inputs[k]=!data.settings.inputs[k]});return}
 if(t.dataset.removeMiss){mutate(()=>{data.settings.options.miss=data.settings.options.miss.filter(x=>x!==t.dataset.removeMiss)});return}
 const a=t.dataset.action;
 if(a==='new-round'){ui.screen='start';render()}
 else if(a==='resume-round'){ui.screen='play';render()}
 else if(a==='open-recent-data'){ui.dataTab='recent';ui.screen='data';render()}
 else if(a==='shot-history'){ui.viewRoundId=t.dataset.id;ui.scorecardRoundId=t.dataset.id;ui.prev='result';ui.screen='shot-history';render()}
 else if(a==='course-half'){saveCourseFields();ui.courseEditHalf=Number(t.dataset.value);render()}
 else if(a==='start-round'){readStartForm();saveCourseFields();mutate(()=>{data.activeRound=createRoundFromStart();ui.screen='play'})}
 else if(a==='memo'){ui.modal={type:'memo'};render()}
 else if(a==='save-memo'){mutate(()=>{currentHole().memo=document.getElementById('memo-text')?.value||'';ui.modal=null})}
 else if(a==='open-scorecard'){ui.prev='play';ui.scorecardRoundId=currentRound().id;ui.screen='scorecard';render()}
 else if(a==='scorecard-from-result'){ui.prev='result';ui.scorecardRoundId=t.dataset.id;ui.screen='scorecard';render()}
 else if(a==='save-shot'){mutate(()=>saveShot(false))}
 else if(a==='skip-shot'){mutate(()=>saveShot(true))}
 else if(a==='manual-holeout'){ui.modal={type:'manualHoleout'};render()}
 else if(a==='confirm-holeout'){const sc=Number(document.getElementById('manual-score')?.value||holeComputedScore(currentHole()));mutate(()=>{finalizeHole(currentHole(),sc);ui.modal=null})}
 else if(a==='set-first-putt'){mutate(()=>{currentHole().currentPuttRemainingM=Number(t.dataset.value)})}
 else if(a==='set-first-putt-custom'){const v=Number(document.getElementById('first-putt-distance')?.value);if(v>0)mutate(()=>{currentHole().currentPuttRemainingM=Math.round(v*2)/2})}
 else if(a==='putt-step'){mutate(()=>{const d=currentHole().puttDraft;d.afterM=Math.max(.5,Math.round((Number(d.afterM||.5)+Number(t.dataset.delta))*2)/2)})}
 else if(a==='putt-custom'){const v=Number(document.getElementById('putt-after-custom')?.value);if(v>=0)mutate(()=>{currentHole().puttDraft.afterM=Math.round(v*2)/2})}
 else if(a==='save-putt'){mutate(()=>savePutt())}
 else if(a==='shot-detail'){ui.modal={type:'shotDetail',index:Number(t.dataset.shot)};render()}
 else if(a==='edit-current-hole'){mutate(()=>{const h=currentHole();h.status='open';h.score=null;h.stage=h.shots.some(s=>s.type==='putt')?'putt':'shot'})}
 else if(a==='next-hole'){mutate(()=>{const r=currentRound();r.currentHoleIndex=Math.min(r.currentHoleIndex+1,r.holes.length-1);const h=currentHole(r);if(h.currentRemainingY==null)h.currentRemainingY=h.distance;h.stage=h.stage||'shot'})}
 else if(a==='finish-round'){finishRound()}
 else if(a==='json'){const r=roundById(t.dataset.id)||currentRound();if(completedHoles(r).length<3){toast('JSONは3H終了後から作成できます');return}ui.modal={type:'json',json:roundJson(r)};render()}
 else if(a==='copy-json'){navigator.clipboard?.writeText(ui.modal.json).then(()=>toast('JSONをコピーしました')).catch(()=>toast('コピーできませんでした'))}
 else if(a==='close-modal'){ui.modal=null;render()}
 else if(a==='add-club'){const n=(document.getElementById('new-club-name')?.value||'').trim(),d=Number(document.getElementById('new-club-distance')?.value||0);if(n&&data.settings.clubs.length<14)mutate(()=>data.settings.clubs.push({id:uid(),name:n,typical:d}))}
 else if(a==='add-miss'){const n=(document.getElementById('new-miss')?.value||'').trim();if(n&&!data.settings.options.miss.includes(n))mutate(()=>data.settings.options.miss.push(n))}
 else if(a==='save-round-setting'){const v=Number(document.getElementById('green-auto')?.value||150);mutate(()=>data.settings.greenAutoYards=clamp(v,20,300));toast('保存しました')}
 else if(a==='clear-samples'){mutate(()=>{data.rounds=data.rounds.filter(r=>!r.sample)});toast('サンプルを削除しました')}
 else if(a==='clear-all'){ui.modal={type:'confirmClear'};render()}
 else if(a==='confirm-clear'){localStorage.removeItem(KEY);data=seed();data.rounds=[];data.activeRound=null;ui.modal=null;ui.screen='home';persist();render();toast('データを削除しました')}
}
function onChange(e){const el=e.target;if(el.id==='start-course'){ui.start.courseId=el.value==='new'?'':el.value;render();return}if(el.classList.contains('hole-par')||el.classList.contains('hole-distance')){saveCourseFields();return}if(el.id==='remaining-after'||el.id==='direct-distance'){const h=currentHole();if(!h)return;if(el.id==='remaining-after')h.draft.remainingAfterY=el.value;else h.draft.directDistance=el.value;persist();return}}

function backTarget(){
 if(ui.screen==='home')return null;
 if(ui.screen==='result')return ui.prev&&ui.prev!=='result'?ui.prev:'history';
 if(ui.screen==='scorecard')return ui.prev&&ui.prev!=='scorecard'?ui.prev:(data.activeRound?.id===ui.scorecardRoundId?'play':'result');
 const map={howto:'home',start:'home',play:'home',history:'home',data:'home',settings:'home','settings-clubs':'settings','settings-input':'settings','settings-round':'settings','settings-data':'settings','club-detail':'data','shot-history':'result'};
 return map[ui.screen]||'home';
}
function swipeBack(){
 if(ui.modal){ui.modal=null;render();return}
 if(ui.screen==='home')return;
 if(history.length>1){history.back();return}
 const target=backTarget();if(!target)return;
 ui.prev=ui.screen;ui.screen=target;render();
}
window.addEventListener('popstate',e=>{
 restoringHistory=true;
 applyHistoryState(e.state);
 render();
 restoringHistory=false;
});
let edgeSwipe=null;
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 const p=e.touches[0];
 // 画面の完全な端はiOS Safariのネイティブ戻るジェスチャーに任せ、
 // 少し内側（20〜64px）もアプリ側の予備ジェスチャーとして受ける。
 if(p.clientX>=20&&p.clientX<=64)edgeSwipe={x:p.clientX,y:p.clientY,t:Date.now(),horizontal:false};
 else edgeSwipe=null;
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
 if(!edgeSwipe||e.touches.length!==1)return;
 const p=e.touches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y;
 if(!edgeSwipe.horizontal&&dx>10&&Math.abs(dx)>Math.abs(dy)*1.2)edgeSwipe.horizontal=true;
 if(edgeSwipe.horizontal&&dx>0)e.preventDefault();
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
 if(!edgeSwipe)return;
 const p=e.changedTouches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y,dt=Date.now()-edgeSwipe.t;
 const ok=edgeSwipe.horizontal&&dx>=55&&Math.abs(dy)<=80&&dt<=1000;
 edgeSwipe=null;
 if(ok)swipeBack();
},{passive:true,capture:true});
document.addEventListener('touchcancel',()=>{edgeSwipe=null},{passive:true,capture:true});

document.addEventListener('click',onClick);document.addEventListener('change',onChange);
render();
})();
</script>
</body>
