<body><div id="app" class="app"></div><div id="modal" class="modal"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ACTIVE_KEY='shotlog.active.v2', ROUNDS_KEY='shotlog.rounds.v2', CLUB_KEY='shotlog.clubs.v1';
const DEFAULT_CLUBS=['Dr','3W','5W','3U','4U','5I','6I','7I','8I','9I','PW','48°','52°','58°','PT'];
const RESULTS=['FW','ラフ','バンカー','池','OB','ペナルティ','グリーン','エッジ','その他'];
const DIRS=['左奥','中央奥','右奥','左','中央','右','左手前','手前','右手前'];
const CURVES=['ドロー','ストレート','フェード'];
const CONTACTS=['良い','薄い','ダフリ','トップ','ヒール','トゥ'];
const MISSES=['フェース開き','シャンク','天ぷら','力んだ','手打ち'];
const WEATHER=['晴','曇','雨','雪'];
let view='home', activeRound=null, activeHoleIndex=0, shotDraft=null, scoreMode='cards';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loadRounds=()=>JSON.parse(localStorage.getItem(ROUNDS_KEY)||'[]'); const saveRounds=x=>localStorage.setItem(ROUNDS_KEY,JSON.stringify(x));
const loadActive=()=>JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null'); const saveActive=()=>activeRound&&localStorage.setItem(ACTIVE_KEY,JSON.stringify(activeRound));
const getClubs=()=>JSON.parse(localStorage.getItem(CLUB_KEY)||'null')||DEFAULT_CLUBS; const setClubs=x=>localStorage.setItem(CLUB_KEY,JSON.stringify(x));
function nav(){const scoreActive=view==='scorecard'; return `<nav class="bottom-nav"><button class="${view==='home'?'active':''}" onclick="go('home')"><span>⌂</span>ホーム</button><button class="${view==='round'?'active':''}" onclick="activeRound?go('round'):go('history')"><span>⚑</span>ラウンド</button><button class="${scoreActive?'active':''}" onclick="activeRound?go('scorecard'):go('history')"><span>▥</span>スコア</button></nav>`}
function go(v){view=v;render();scrollTo(0,0)}
function defaultHoles(){return Array.from({length:18},(_,i)=>({number:i+1,par:null,yard:null,shots:[],done:false,manualScore:null,manualPutts:null,nextStrokeNo:1,note:''}))}
function holeEditorRow(h){return `<div class="hole-row" data-hole="${h.number}"><strong>${h.number}</strong><input class="mini-input par" type="number" inputmode="numeric" placeholder="PAR" min="3" max="6"><input class="mini-input yard" type="number" inputmode="numeric" placeholder="yd"></div>`}
function home(){const ar=loadActive(); return `<section><div class="hero"><div class="hero-copy"><div><span class="brand">Shot log</span><span class="brand-dot"></span></div><div class="tagline">Play. Record. Reflect.</div><p>あの一打を、あとで見返そう。</p></div></div><div class="home-card card">${ar?`<button class="primary green" onclick="resumeRound()">ラウンドを再開</button><p class="tiny">${esc(ar.courseName||'ラウンド')} ・ Hole ${ar.holes.find(h=>!h.done)?.number||ar.holes.length}</p>`:`<button class="primary" onclick="go('setup')">ラウンドを始める</button>`}</div><div class="menu"><div class="section-title">SHOT LOG</div><div class="menu-row" onclick="go('history')"><div class="menu-ico">▥</div><div><b>過去のラウンド</b><small>ショットごとの記録を見返す</small></div><div class="chev">›</div></div><div class="menu-row" onclick="go('history')"><div class="menu-ico">↗</div><div><b>データを見る</b><small>クラブ・ミス・パットを振り返る</small></div><div class="chev">›</div></div><div class="menu-row small" onclick="openClubSettings()"><div class="menu-ico">⛳</div><div><b>クラブ設定</b><small>ラウンドで使うクラブを選ぶ</small></div><div class="chev">›</div></div><div class="menu-row"><div class="menu-ico">i</div><div><b>このアプリについて</b><small>Play. Record. Reflect.</small></div></div></div></section>${nav()}`}
function setup(){const holes=defaultHoles(); window._setupHoles=holes; return `<div class="topbar"><button class="back" onclick="go('home')">‹</button><h2>ラウンド設定</h2><div class="ghost"></div></div><div class="form-card card"><div class="field"><label>コース名 <span class="optional">任意</span></label><input id="courseName" class="input" autocomplete="off" autocorrect="off" autocapitalize="off" name="golf_course_title" placeholder="例：○○カントリークラブ"></div><div class="field"><label>日付</label><input id="roundDate" type="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>天気</label><div class="choice-row">${WEATHER.map((x,i)=>`<button class="chip ${i===0?'selected':''}" data-weather="${x}" onclick="selectOne('[data-weather]',this)">${x==='晴'?'☀ ':x==='曇'?'☁ ':x==='雨'?'☂ ':'❄ '}${x}</button>`).join('')}</div></div><div class="field"><label>前半コース</label><input id="frontCourse" class="input" autocomplete="off" placeholder="例：OUT / 東 / さくら"></div><div class="field"><label>後半コース</label><input id="backCourse" class="input" autocomplete="off" placeholder="例：IN / 西 / つばき"></div><div class="field"><label>ティー</label><input id="teeName" class="input" autocomplete="off" placeholder="例：White / Regular / 青"></div><div class="field"><label>グリーン</label><input id="greenName" class="input" autocomplete="off" placeholder="例：ベントA / 高麗 / Aグリーン"></div><div class="field"><label>今日の目標スコア</label><input id="targetScore" type="number" inputmode="numeric" class="input" placeholder="例：89"></div><div class="field"><label>ホール</label><div class="tabs"><button class="active" data-count="18" onclick="setHoleCount(18,this)">18H</button><button data-count="9" onclick="setHoleCount(9,this)">9H</button></div></div><div class="section-title">距離・PAR</div><p class="note">最初は空欄です。事前入力でも、ラウンド中の修正でもOKです。</p><div id="holesEditor" class="holes-editor">${holes.map(h=>holeEditorRow(h)).join('')}</div><button class="primary" style="margin-top:16px" onclick="startRound()">この設定で開始</button></div>`}
function selectOne(sel,el){$$(sel).forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function setHoleCount(n,el){$$('.tabs [data-count]').forEach(x=>x.classList.remove('active'));el.classList.add('active');$$('.hole-row').forEach((r,i)=>r.style.display=i<n?'grid':'none')}
function startRound(){const count=+$('[data-count].active').dataset.count; const rows=$$('.hole-row').slice(0,count); const holes=rows.map((r,i)=>({number:i+1,par:r.querySelector('.par').value?+r.querySelector('.par').value:null,yard:r.querySelector('.yard').value?+r.querySelector('.yard').value:null,shots:[],done:false,manualScore:null,manualPutts:null,nextStrokeNo:1,note:''})); const w=$('[data-weather].selected')?.dataset.weather||'晴'; activeRound={id:uid(),courseName:$('#courseName').value.trim(),date:$('#roundDate').value,weather:w,frontCourse:$('#frontCourse').value.trim(),backCourse:$('#backCourse').value.trim(),tee:$('#teeName').value.trim(),green:$('#greenName').value.trim(),targetScore:$('#targetScore').value?+$('#targetScore').value:null,startedAt:new Date().toISOString(),holes}; activeHoleIndex=0; saveActive(); go('round')}
function resumeRound(){activeRound=loadActive();activeHoleIndex=Math.max(0,activeRound.holes.findIndex(h=>!h.done));if(activeHoleIndex<0)activeHoleIndex=0;go('round')}
function currentHole(){return activeRound.holes[activeHoleIndex]}
function scoreFor(h){if(h.manualScore!=null)return h.manualScore; if(!h.shots.length)return 0; return Math.max(...h.shots.map(s=>s.strokeNo||0),h.nextStrokeNo-1)}
function puttsFor(h){return h.manualPutts??h.shots.filter(s=>s.club==='PT').length}
function totalStats(r){const done=r.holes.filter(h=>h.done);const total=done.reduce((a,h)=>a+scoreFor(h),0),par=done.reduce((a,h)=>a+(h.par||0),0),putts=done.reduce((a,h)=>a+puttsFor(h),0);return{done:done.length,total,par,diff:total-par,putts}}
function currentRemaining(h){if(!h.shots.length)return h.yard??null; const last=h.shots[h.shots.length-1]; if(last.club==='PT')return null; if(last.result==='グリーン')return last.greenRemainYd??null; return last.remainingYd??null}
function currentPuttStartM(h){const last=h.shots[h.shots.length-1]; if(!last)return null; if(last.club==='PT')return last.remainingM??null; if(last.result==='グリーン'&&last.greenRemainYd!=null)return Math.round(last.greenRemainYd*0.9144*10)/10; return null}
function round(){if(!activeRound){activeRound=loadActive();if(!activeRound)return home()}const h=currentHole(),rem=currentRemaining(h),stroke=h.nextStrokeNo||1;return `<div class="round-head"><div class="round-top"><div><div class="round-title-line"><div class="round-hole">Hole ${h.number}</div><div class="round-par-yard">${h.par?'PAR '+h.par:'PAR —'}${h.yard?' · '+h.yard+' yd':''}</div></div></div><button class="edit-link" onclick="editHoleInfo()">距離/PAR修正</button></div><div class="round-brand">Shot log<span style="color:#e25f5b">•</span></div><div class="remaining-block"><div><div class="remaining-label">現在の残り距離</div><div class="remaining-value">${rem==null?'—':rem}<small>${rem==null?'':' yd'}</small></div></div><div class="stroke-badge">${stroke}打目</div></div></div><div class="shot-list">${h.shots.length?h.shots.map((s,i)=>shotItem(s,i)).join(''):`<div class="empty" style="padding:34px 10px">まだショットはありません。<br>打った後に結果だけ記録します。</div>`}</div><div class="round-actions"><button class="primary" onclick="openShot()">＋ ショットを記録</button><button class="secondary" onclick="undoShot()">1打戻す</button><button class="secondary" onclick="finishHole()">ホール終了</button></div><p class="tiny">狙いは入力しません。プレーに集中して、結果だけ残します。</p>${nav()}`}
function shotItem(s,i){const d=s.actualYd!=null?`${s.actualYd}yd`:s.estimatedYd!=null?`約${s.estimatedYd}yd`:''; const parts=[s.result,s.direction,s.curve,s.contact,...(s.misses||[])].filter(Boolean).join('・'); const sub=s.club==='PT'?`${s.puttStartM??'—'}m → ${s.remainingM??'—'}m`:(s.result==='グリーン'&&s.greenRemainYd!=null?`カップまで ${s.greenRemainYd}yd / ${(s.greenRemainYd*0.9144).toFixed(1)}m`:s.remainingYd!=null?`次の残り ${s.remainingYd}yd`:'距離未入力'); return `<div class="shot-item" onclick="editShot(${i})"><div class="shot-num">${s.strokeNo}</div><div class="shot-club">${esc(s.club)}</div><div><div class="shot-main">${esc(parts||'結果のみ記録')}</div><div class="shot-sub">${esc(sub)}${s.incomplete?' ・ 未入力あり':''}</div></div><div class="shot-distance">${d}</div></div>`}
function openShot(i=null){const h=currentHole(); const prev=h.shots[h.shots.length-1]; const edit=i!=null?h.shots[i]:null; const startYd=edit?.startDistanceYd??currentRemaining(h); const patchPrev=!edit&&prev&&prev.club!=='PT'&&prev.remainingYd==null&&prev.result!=='グリーン'; shotDraft=edit?JSON.parse(JSON.stringify(edit)):{id:uid(),strokeNo:h.nextStrokeNo||1,club:'',result:'',direction:'',curve:'',contact:'',misses:[],startDistanceYd:startYd,remainingYd:null,actualYd:null,estimatedYd:null,greenRemainYd:null,puttStartM:currentPuttStartM(h),remainingM:null,puttResult:'',treatment:'',nextStrokeOverride:null,incomplete:false,patchPrev}; if(edit)shotDraft.editIndex=i; renderModal()}
function editShot(i){openShot(i)}
function renderModal(){const m=$('#modal');m.className='modal open';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${shotDraft.editIndex!=null?'ショットを修正':'ショット入力'}</h2><button class="close" onclick="closeModal()">×</button></div><div id="shotBody">${shotForm()}</div></div>`}
function closeModal(){$('#modal').className='modal';$('#modal').innerHTML=''}
function chips(field,arr,extra=''){return arr.map(v=>`<button class="chip ${shotDraft[field]===v?'selected':''}" onclick="setDraft('${field}','${v}')">${v}</button>`).join('')}
function multiChips(field,arr){return arr.map(v=>`<button class="chip ${(shotDraft[field]||[]).includes(v)?'selected':''}" onclick="toggleMulti('${field}','${v}')">${v}</button>`).join('')}
function setDraft(f,v){shotDraft[f]=v;if(f==='club'&&v==='PT'){shotDraft.result='';shotDraft.direction='';shotDraft.curve='';shotDraft.contact='';shotDraft.misses=[];if(shotDraft.puttStartM==null)shotDraft.puttStartM=currentPuttStartM(currentHole())}refreshShotBody()}
function toggleMulti(f,v){const a=shotDraft[f]||[];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);shotDraft[f]=a;refreshShotBody()}
function refreshShotBody(){const b=$('#shotBody');if(b)b.innerHTML=shotForm()}
function shotForm(){const clubs=getClubs(); const putt=shotDraft.club==='PT'; return `<div class="shot-form">${shotDraft.patchPrev?patchPrevBlock():''}<div class="card"><h3>クラブ</h3><div class="chips">${clubs.map(c=>`<button class="chip ${shotDraft.club===c?'selected':''}" onclick="setDraft('club','${c}')">${c}</button>`).join('')}</div></div>${putt?puttForm():normalForm()}<div class="sticky-save"><button class="primary" onclick="saveShot()">このショットを保存</button></div>${shotDraft.editIndex!=null?`<button class="secondary danger-text" style="margin-top:8px" onclick="deleteShot(${shotDraft.editIndex})">このショットを削除</button>`:''}</div>`}
function patchPrevBlock(){const prev=currentHole().shots.at(-1);return `<div class="card"><h3>前のショットの距離を補完</h3><p class="note">次の地点で残り距離が分かったら入力。前のショット距離を自動計算します。</p><div class="distance-row"><input id="patchPrevRemain" class="input" type="number" inputmode="decimal" placeholder="現在の残り距離" oninput="patchPreviousDistance(this.value)"><span class="unit">yd</span></div><div class="distance-helper">${prev?.club||''} の距離を後から更新します。</div></div>`}
function patchPreviousDistance(v){const n=v===''?null:+v; shotDraft.startDistanceYd=n; if(n!=null){const h=currentHole(),prev=h.shots.at(-1);prev.remainingYd=n;if(prev.startDistanceYd!=null)prev.estimatedYd=Math.max(0,Math.abs(prev.startDistanceYd-n));saveActive()}}
function normalForm(){return `<div class="card"><h3>どこへ行ったか</h3><div class="chips">${chips('result',RESULTS)}</div></div><div class="card"><h3>方向 <span class="optional">任意・常に3×3</span></h3><div class="chips grid9">${chips('direction',DIRS)}</div></div><div class="card"><h3>球筋 <span class="optional">任意</span></h3><div class="chips three">${chips('curve',CURVES)}</div></div><div class="card"><h3>打感 <span class="optional">任意</span></h3><div class="chips three">${chips('contact',CONTACTS)}</div></div><div class="card"><h3>ミス <span class="optional">複数可</span></h3><div class="chips three">${multiChips('misses',MISSES)}</div></div>${penaltyBlock()}${distanceBlock()}`}
function penaltyBlock(){if(!['OB','ペナルティ'].includes(shotDraft.result))return''; const ob=shotDraft.result==='OB'; const opts=ob?['打ち直し','プレ4','プレ3','打数を指定']:['そのまま打つ','1罰で救済','プレ3','プレ4','打数を指定']; return `<div class="card treatment"><h3>次の処置</h3><div class="chips three">${chips('treatment',opts)}</div>${shotDraft.treatment==='打数を指定'?`<div class="distance-row" style="margin-top:10px"><input class="input" type="number" inputmode="numeric" placeholder="次は何打目？" value="${shotDraft.nextStrokeOverride??''}" oninput="shotDraft.nextStrokeOverride=this.value===''?null:+this.value"><span class="unit">打目</span></div>`:''}</div>`}
function distanceBlock(){const green=shotDraft.result==='グリーン'; return `<div class="card"><h3>距離 <span class="optional">後から編集OK</span></h3>${green?`<div class="distance-pair"><div class="box"><label>ショット距離</label><div class="distance-row"><input class="input" type="number" inputmode="decimal" placeholder="例 150" value="${shotDraft.actualYd??''}" oninput="setActual(this.value)"><span class="unit">yd</span></div></div><div class="box"><label>カップまで</label><div class="distance-row"><input class="input" type="number" step="0.1" inputmode="decimal" placeholder="例 5" value="${shotDraft.greenRemainYd??''}" oninput="shotDraft.greenRemainYd=this.value===''?null:+this.value"><span class="unit">yd</span></div></div></div><div class="distance-helper">次のパター画面では、カップまでの距離を 1yd = 0.9144m で自動換算。換算後も手修正できます。</div>`:`<div class="distance-pair"><div class="box"><label>次の残り距離</label><div class="distance-row"><input class="input" type="number" inputmode="decimal" placeholder="例 120" value="${shotDraft.remainingYd??''}" oninput="setRemaining(this.value)"><span class="unit">yd</span></div></div><div class="box"><label>実測 / 推定距離</label><div class="distance-row"><input class="input" type="number" inputmode="decimal" placeholder="例 230" value="${shotDraft.actualYd??''}" oninput="setActual(this.value)"><span class="unit">yd</span></div></div></div><div class="distance-helper">どちらかを入れると、もう片方を補助計算します。両方とも手修正できます。距離なしでも保存可能です。</div>`}</div>`}
function setRemaining(v){shotDraft.remainingYd=v===''?null:+v;if(shotDraft.remainingYd!=null&&shotDraft.startDistanceYd!=null)shotDraft.actualYd=Math.max(0,Math.abs(shotDraft.startDistanceYd-shotDraft.remainingYd));refreshShotBody()}
function setActual(v){shotDraft.actualYd=v===''?null:+v;if(shotDraft.result!=='グリーン'&&shotDraft.actualYd!=null&&shotDraft.startDistanceYd!=null)shotDraft.remainingYd=Math.max(0,Math.abs(shotDraft.startDistanceYd-shotDraft.actualYd));refreshShotBody()}
function puttForm(){const r=['カップイン','ショート','オーバー','左に外し','右に外し','カップ1個外し','OK'];return `<div class="card"><div class="putt-hero"><h3>パター</h3><div class="putt-big">距離は m・小数第1位まで</div><p class="note">グリーンオン時のydは自動でmに換算。ここで自由に修正できます。</p></div></div><div class="card"><h3>打つ前の距離</h3><div class="distance-row"><input class="input" type="number" step="0.1" inputmode="decimal" placeholder="例 4.6" value="${shotDraft.puttStartM??''}" oninput="shotDraft.puttStartM=this.value===''?null:Math.round(+this.value*10)/10"><span class="unit">m</span></div></div><div class="card"><h3>結果</h3><div class="chips three">${chips('puttResult',r)}</div></div><div class="card"><h3>次の距離</h3><div class="distance-row"><input class="input" type="number" step="0.1" inputmode="decimal" placeholder="例 1.5" value="${shotDraft.remainingM??''}" oninput="shotDraft.remainingM=this.value===''?null:Math.round(+this.value*10)/10"><span class="unit">m</span></div></div>`}
function computeNextStroke(s){const n=s.strokeNo||1;if(s.result==='OB'){if(s.treatment==='プレ4')return 4;if(s.treatment==='プレ3')return 3;if(s.treatment==='打数を指定'&&s.nextStrokeOverride)return s.nextStrokeOverride;return n+2} if(s.result==='ペナルティ'){if(s.treatment==='プレ4')return 4;if(s.treatment==='プレ3')return 3;if(s.treatment==='打数を指定'&&s.nextStrokeOverride)return s.nextStrokeOverride;if(s.treatment==='そのまま打つ')return n+1;return n+2} return n+1}
function saveShot(){if(!shotDraft.club){alert('クラブを選択してください');return} const h=currentHole(); if(shotDraft.club==='PT'&&['カップイン','OK'].includes(shotDraft.puttResult)&&shotDraft.remainingM==null)shotDraft.remainingM=0; if(shotDraft.actualYd==null&&shotDraft.startDistanceYd!=null&&shotDraft.remainingYd!=null)shotDraft.estimatedYd=Math.max(0,Math.abs(shotDraft.startDistanceYd-shotDraft.remainingYd)); shotDraft.incomplete=!shotDraft.result&&!shotDraft.puttResult || (shotDraft.club!=='PT' && !shotDraft.contact && !(shotDraft.misses||[]).length); const idx=shotDraft.editIndex; delete shotDraft.editIndex; delete shotDraft.patchPrev; if(idx!=null)h.shots[idx]=shotDraft; else h.shots.push(shotDraft); if(idx==null)h.nextStrokeNo=computeNextStroke(shotDraft); else recomputeStrokeNo(h); saveActive(); closeModal(); render()}
function recomputeStrokeNo(h){let n=1;h.shots.forEach(s=>{s.strokeNo=s.strokeNo||n;n=computeNextStroke(s)});h.nextStrokeNo=n}
function deleteShot(i){if(confirm('このショットを削除しますか？')){const h=currentHole();h.shots.splice(i,1);recomputeStrokeNo(h);saveActive();closeModal();render()}}
function undoShot(){const h=currentHole();if(!h.shots.length)return;if(confirm('最後の1打を取り消しますか？')){h.shots.pop();recomputeStrokeNo(h);saveActive();render()}}
function editHoleInfo(){const h=currentHole();const yard=prompt('ホール距離（yd）',h.yard??'');if(yard===null)return;const par=prompt('PAR（3 / 4 / 5）',h.par??'');if(par===null)return;h.yard=yard===''?null:+yard;h.par=par===''?null:+par;saveActive();render()}
function finishHole(){const h=currentHole();if(!h.shots.length&&!confirm('ショット記録なしでホール終了しますか？'))return;go('holeFinish')}
function holeFinish(){const h=currentHole(),score=scoreFor(h),putts=puttsFor(h),d=h.par?score-h.par:null;return `<div class="topbar"><button class="back" onclick="go('round')">‹</button><h2>Hole ${h.number}</h2><div class="ghost"></div></div><div class="hole-finish"><div style="font-size:34px">⚑</div><h2>Hole ${h.number} 完了</h2><div class="note">${h.par?'PAR '+h.par:'PAR —'}${h.yard?' ・ '+h.yard+'yd':''}</div><div class="score-box"><div><small>スコア</small><strong>${score}</strong><em>${d==null?'':diffText(d)}</em></div><div><small>パット</small><strong>${putts}</strong><em>PUTT</em></div></div><button class="secondary" onclick="manualScore()">打数・パット数を修正</button><div class="field" style="margin-top:12px"><label>このホールの一言メモ <span class="optional">任意</span></label><input id="holeNote" class="input" value="${esc(h.note||'')}" placeholder="例：2打目で無理した"></div><button class="primary green" onclick="nextHole()">${activeHoleIndex===activeRound.holes.length-1?'ラウンドを終了':'次のホールへ'}</button></div>`}
function manualScore(){const h=currentHole();const s=prompt('スコア（打数）',scoreFor(h));if(s===null)return;const p=prompt('パット数',puttsFor(h));if(p===null)return;h.manualScore=Math.max(1,+s||scoreFor(h));h.manualPutts=Math.max(0,+p||0);saveActive();render()}
function nextHole(){const h=currentHole();h.note=$('#holeNote')?.value.trim()||h.note||'';h.done=true;saveActive();if(activeHoleIndex>=activeRound.holes.length-1){completeRound();return}activeHoleIndex++;go('round')}
function completeRound(){activeRound.completedAt=new Date().toISOString();const rounds=loadRounds();rounds.unshift(activeRound);saveRounds(rounds);localStorage.removeItem(ACTIVE_KEY);window._summaryRound=activeRound;activeRound=null;go('summary')}
function diffText(d){if(d===0)return'E';return d>0?`+${d}`:`${d}`}
function history(){const rounds=loadRounds();return `<div class="topbar"><button class="back" onclick="go('home')">‹</button><h2>過去のラウンド</h2><div class="ghost"></div></div>${rounds.length?`<div class="menu">${rounds.map((r,i)=>{const st=totalStats(r);return `<div class="menu-row" onclick="openSummary(${i})"><div class="menu-ico">${st.total||'–'}</div><div><b>${esc(r.courseName||'ラウンド')}</b><small>${esc(r.date||'')} ・ ${st.done}H ・ ${st.putts} putts</small></div><div class="chev">›</div></div>`}).join('')}</div>`:`<div class="empty">まだラウンド記録はありません。</div>`}${nav()}`}
function openSummary(i){window._summaryRound=loadRounds()[i];go('summary')}
function scorecard(){const r=activeRound||window._summaryRound||loadRounds()[0];if(!r)return history(); return `<div class="topbar"><button class="back" onclick="${activeRound?"go('round')":"go('history')"}">‹</button><h2>スコアカード</h2><button class="iconbtn" onclick="openRoundSummaryFromScore()">↗</button></div><div class="score-toggle"><div class="tabs"><button class="${scoreMode==='cards'?'active':''}" onclick="scoreMode='cards';render()">カード</button><button class="${scoreMode==='table'?'active':''}" onclick="scoreMode='table';render()">一覧</button></div></div>${scoreMode==='cards'?scoreCards(r):scoreTable(r)}${nav()}`}
function shotEval(s){if(s.result==='OB'||s.result==='ペナルティ'||(s.misses||[]).some(x=>['シャンク','天ぷら'].includes(x))||['ダフリ','トップ'].includes(s.contact))return'bad'; if(s.contact==='良い'&&!s.misses?.length)return'good'; return'mid'}
function scoreCards(r){return `<div class="score-cards">${r.holes.map(h=>{const all=displayMiniShots(h);return `<div class="hole-card" onclick="openHoleDetail(${h.number-1},${activeRound?'true':'false'})"><div class="hc-head"><b>H${h.number}</b><span>Par ${h.par??'—'}</span></div><div class="hc-score">${h.done||h.shots.length?scoreFor(h):'—'}</div>${all}</div>`}).join('')}</div>`}
function displayMiniShots(h){if(!h.shots.length)return'<div class="subtle">未プレー</div>'; let arr=h.shots.map(s=>({club:s.club,eval:shotEval(s)})); let html=''; let count=0; for(let i=0;i<arr.length&&count<6;i++){if(arr[i].club==='PT'){let j=i;while(j<arr.length&&arr[j].club==='PT')j++;const n=j-i;html+=`<div class="mini-shot"><span class="eval-dot eval-${arr[i].eval}"></span><b>PT${n>1?' ×'+n:''}</b></div>`;i=j-1}else html+=`<div class="mini-shot"><span class="eval-dot eval-${arr[i].eval}"></span><b>${esc(arr[i].club)}</b></div>`;count++} if(arr.length>6)html+=`<div class="mini-shot"><span class="pill">＋${arr.length-6}打</span></div>`;return html}
function scoreTable(r){const rows=[['打数',h=>h.done||h.shots.length?scoreFor(h):''],['パット',h=>h.done||h.shots.length?puttsFor(h):''],['FWキープ・1オン',h=>fwGir(h)],['ティーショット',h=>h.shots[0]?.club||''],['バンカー',h=>h.shots.filter(s=>s.result==='バンカー').length],['OB',h=>h.shots.filter(s=>s.result==='OB').length],['ペナルティ',h=>h.shots.filter(s=>s.result==='ペナルティ').length]];return `<div class="score-table-wrap"><table class="score-table"><thead><tr><th>ホール</th>${r.holes.map(h=>`<th><button class="holelink" onclick="openHoleDetail(${h.number-1},${activeRound?'true':'false'})">${h.number}</button></th>`).join('')}<th>合計</th></tr><tr><th>Par</th>${r.holes.map(h=>`<td>${h.par??''}</td>`).join('')}<td>${r.holes.reduce((a,h)=>a+(h.par||0),0)||''}</td></tr></thead><tbody>${rows.map(([name,fn])=>`<tr><th>${name}</th>${r.holes.map(h=>`<td>${fn(h)}</td>`).join('')}<td>${tableTotal(name,r)}</td></tr>`).join('')}</tbody></table></div>`}
function fwGir(h){if(!h.shots.length)return'';const s=h.shots[0];if(h.par===3)return s.result==='グリーン'?'◎':directionArrow(s.direction);return s.result==='FW'?'◎':directionArrow(s.direction)}
function directionArrow(d){if(!d)return'';if(d.includes('左'))return'←';if(d.includes('右'))return'→';if(d.includes('手前'))return'↓';if(d.includes('奥'))return'↑';return'→'}
function tableTotal(name,r){if(name==='打数')return r.holes.reduce((a,h)=>a+(h.done?scoreFor(h):0),0)||'';if(name==='パット')return r.holes.reduce((a,h)=>a+(h.done?puttsFor(h):0),0)||'';if(['バンカー','OB','ペナルティ'].includes(name))return r.holes.reduce((a,h)=>a+(name==='バンカー'?h.shots.filter(s=>s.result==='バンカー').length:name==='OB'?h.shots.filter(s=>s.result==='OB').length:h.shots.filter(s=>s.result==='ペナルティ').length),0);return''}
function openHoleDetail(idx,isActive){const r=isActive?activeRound:(window._summaryRound||loadRounds()[0]);const h=r.holes[idx]; const html=`<div class="sheet"><div class="sheet-head"><h2>Hole ${h.number} ・ Score ${scoreFor(h)||'—'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="shot-list">${h.shots.length?h.shots.map((s,i)=>shotItem(s,i)).join(''):'<div class="empty">ショット記録なし</div>'}${h.note?`<div class="card" style="padding:14px;margin-top:10px"><b>メモ</b><p class="note">${esc(h.note)}</p></div>`:''}</div></div>`;$('#modal').className='modal open';$('#modal').innerHTML=html}
function openRoundSummaryFromScore(){if(activeRound){window._summaryRound=activeRound}go('summary')}
function summary(){const r=window._summaryRound||loadRounds()[0];if(!r)return history(); const st=totalStats(r),shots=r.holes.flatMap(h=>h.shots),nonP=shots.filter(s=>s.club!=='PT'); const out=r.holes.slice(0,9).filter(h=>h.done).reduce((a,h)=>a+scoreFor(h),0),inn=r.holes.slice(9).filter(h=>h.done).reduce((a,h)=>a+scoreFor(h),0); const fw=findFw(r),gir=findGir(r),bunker=shots.filter(s=>s.result==='バンカー').length,ob=shots.filter(s=>s.result==='OB').length,pen=shots.filter(s=>s.result==='ペナルティ').length; const trend=trendData(nonP); const clubCounts=countBy(shots,'club'); const contactCounts=countBy(nonP,'contact'); const missCounts={}; nonP.forEach(s=>(s.misses||[]).forEach(m=>missCounts[m]=(missCounts[m]||0)+1)); const dirCounts={};nonP.forEach(s=>{if(s.direction)dirCounts[s.direction]=(dirCounts[s.direction]||0)+1}); const best=bestShot(r); return `<div class="summary-hero"><div class="summary-brand">Shot log<span style="color:#e25f5b">•</span></div><div class="tagline">Play. Record. Reflect.</div><div class="summary-course">${esc(r.date||'')}　${esc(r.courseName||'Round')}<br><span style="opacity:.85">${esc(r.frontCourse||'')}${r.backCourse?' / '+esc(r.backCourse):''}　${esc(r.tee||'')} ${esc(r.green||'')}</span></div></div><div class="summary-score-card"><div><span>OUT</span><strong>${out||'—'}</strong></div><div class="total"><span>TOTAL</span><strong>${st.total||'—'}</strong><span>${r.targetScore?`目標 ${r.targetScore}`:''}</span></div><div><span>IN</span><strong>${inn||'—'}</strong></div></div><div class="stat-grid"><div class="card stat"><span>PUTTS</span><strong>${st.putts}</strong></div><div class="card stat"><span>FW KEEP</span><strong>${fw}</strong></div><div class="card stat"><span>GIR / 1ON</span><strong>${gir}</strong></div><div class="card stat"><span>BUNKER</span><strong>${bunker}</strong></div><div class="card stat"><span>OB</span><strong>${ob}</strong></div><div class="card stat"><span>PENALTY</span><strong>${pen}</strong></div></div><div class="analysis"><div class="section-title">今日の傾向</div><div class="card">${trend}</div><div class="section-title">方向</div><div class="card">${barRows(dirCounts)}</div><div class="section-title">打感</div><div class="card">${barRows(contactCounts)}</div><div class="section-title">ミス</div><div class="card">${barRows(missCounts)}</div><div class="section-title">クラブ使用</div><div class="card">${barRows(clubCounts)}</div>${best?`<div class="section-title">BEST SHOT</div><div class="card"><b>H${best.hole}　${esc(best.shot.club)}　${best.shot.actualYd??best.shot.estimatedYd??''}yd</b><p class="note">${esc([best.shot.result,best.shot.direction,best.shot.contact].filter(Boolean).join('・'))}</p></div>`:''}<button class="secondary" onclick="go('scorecard')">スコアカードを見る</button></div>${nav()}`}
function countBy(arr,key){const o={};arr.forEach(x=>{const v=x[key];if(v)o[v]=(o[v]||0)+1});return o}
function barRows(obj){const es=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!es.length)return'<p class="note">記録がありません。</p>';const max=Math.max(...es.map(x=>x[1]),1);return es.map(([k,v])=>`<div class="bar-row"><b>${esc(k)}</b><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div><strong>${v}</strong></div>`).join('')}
function findFw(r){const opp=r.holes.filter(h=>h.done&&h.par&&h.par>3);if(!opp.length)return'—';const hit=opp.filter(h=>h.shots[0]?.result==='FW').length;return `${hit}/${opp.length}`}
function findGir(r){const done=r.holes.filter(h=>h.done);if(!done.length)return'—';const hit=done.filter(h=>h.shots.some(s=>s.result==='グリーン')).length;return `${hit}/${done.length}`}
function trendData(shots){if(!shots.length)return'<p class="note">まだショットデータがありません。</p>';const dir=countBy(shots,'direction');const cont=countBy(shots,'contact');const miss={};shots.forEach(s=>(s.misses||[]).forEach(m=>miss[m]=(miss[m]||0)+1));const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];const a=top(dir),b=top(cont),c=top(miss);return `<p class="note" style="font-size:13px">${a?`方向は <b>${esc(a[0])}</b> が最多（${a[1]}回）。`:''}${b?`打感は <b>${esc(b[0])}</b> が最多（${b[1]}回）。`:''}${c?`ミスは <b>${esc(c[0])}</b> が最多（${c[1]}回）。`:''}</p>`}
function bestShot(r){let best=null;for(const h of r.holes)for(const s of h.shots){if(s.club==='PT')continue;if(s.contact==='良い'&&s.result==='グリーン')return{hole:h.number,shot:s};if(!best&&s.contact==='良い')best={hole:h.number,shot:s}}return best}
function openClubSettings(){const all=DEFAULT_CLUBS,sel=getClubs();$('#modal').className='modal open';$('#modal').innerHTML=`<div class="sheet"><div class="sheet-head"><h2>クラブ設定</h2><button class="close" onclick="closeModal()">×</button></div><div class="shot-form"><div class="card"><p class="note">ラウンド中に表示するクラブを選んでください。</p><div class="chips">${all.map(c=>`<button class="chip ${sel.includes(c)?'selected':''}" data-clubset="${c}" onclick="this.classList.toggle('selected')">${c}</button>`).join('')}</div></div><button class="primary" onclick="saveClubSettings()">保存</button></div></div>`}
function saveClubSettings(){const sel=$$('[data-clubset].selected').map(x=>x.dataset.clubset);if(!sel.length){alert('1本以上選択してください');return}setClubs(sel);closeModal()}
function render(){let html='';if(view==='home')html=home();else if(view==='setup')html=setup();else if(view==='round')html=round();else if(view==='holeFinish')html=holeFinish();else if(view==='history')html=history();else if(view==='scorecard')html=scorecard();else if(view==='summary')html=summary();$('#app').innerHTML=html}
window.addEventListener('load',render);
</script></body></html>
