<script>
(() => {
'use strict';
const KEY='shot-log:v1:data';
const TODAY=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const pct=(n,d)=>d?Math.round(n/d*100):0;
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const avg=a=>a.length?sum(a)/a.length:0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`};
const scoreLabel=d=>d===0?'E':d>0?`+${d}`:`${d}`;
const SHOT_STYLE_DEFAULTS=['ノーマル','フルショット','ライン出し','パンチショット','スティンガー','ハーフショット','スリークォーター','コントロールショット','ロブショット','ピッチショット','チップショット','バンカーショット','バニラ'];
const GOOD_DEFAULTS=['振り切れた','力まず打てた','バランス○','前傾維持','テンポ○','フィニッシュ○','軸ブレなし','回転できた'];
const MISS_DEFAULTS=['ダフリ','トップ','シャンク','フェース開いた','フェース被った','力んだ','ひっかけ','手打ち','突っ込み','オーバースイング','起き上がり','振りきれず','振り急ぎ','体が止まった','スウェー'];
const configItems=labels=>labels.map((label,i)=>({id:'builtin-'+i+'-'+label,label,enabled:false,custom:false}));
function defaultSettings(){return{
  clubs:['1W','5W','3U','4U','5I','6I','7I','8I','9I','PW','48°','52°','58°','パター'].map((name,i)=>({id:uid(),name,typical:[225,195,188,180,165,155,145,135,120,100,85,65,45,0][i]})),
  inputs:{ballFlight:true,feel:false,slope:false,lie:false,pin:false,penaltyDetails:true},
  options:{feel:['良い','普通','悪い','上目','下目','ヒール','トゥ']},
  shotStyles:configItems(SHOT_STYLE_DEFAULTS),
  feedback:{good:configItems(GOOD_DEFAULTS),miss:configItems(MISS_DEFAULTS)},
  greenAutoYards:150
}}
function defaultCourse(){
  const pars=[4,4,3,5,4,4,3,5,4,4,3,4,5,4,4,3,5,4];
  const ds=[385,402,165,515,372,410,148,532,398,401,177,356,505,392,418,154,540,380];
  return {id:uid(),name:'サンプルゴルフクラブ',tee:'Regular',sections:['OUT','IN'],holes:pars.map((par,i)=>({number:i+1,par,distance:ds[i]}))};
}
function sampleRound(date,scoreTarget,puttTarget,index){
  const c=defaultCourse(); const holes=[]; let scoreLeft=scoreTarget,puttLeft=puttTarget;
  for(let i=0;i<18;i++){
    const base=c.holes[i]; const remaining=18-i;
    let score=i===17?scoreLeft:clamp(Math.round(scoreLeft/remaining),base.par-1,base.par+3); scoreLeft-=score;
    let putts=i===17?puttLeft:clamp(Math.round(puttLeft/remaining),1,3); puttLeft-=putts;
    const nonPutts=Math.max(1,score-putts); const shots=[];
    for(let s=0;s<nonPutts;s++){
      const clubs=['1W','7I','8I','PW','52°']; const club=s===0&&base.par>3?'1W':clubs[(i+s+index)%clubs.length];
      const dir=['左','中央','右'][(i+s+index)%3]; const flight=['ドロー','ストレート','フェード'][(i+2*s+index)%3];
      const good=((i+s+index)%4)!==0; const typical=(defaultSettings().clubs.find(x=>x.name===club)||{}).typical||120;
      shots.push({id:uid(),type:'shot',num:shots.length+1,club,direction:dir,directionMode:'normal',greenCell:'',flight,quality:good?'Good':'ミス',misses:good?[]:[['ダフリ','トップ','フェース開き'][(i+s)%3]],landing:s===nonPutts-1?'Green':(s===0&&base.par>3?((i+index)%3===0?'ラフ':'FW'):'ラフ'),remainingBeforeY:Math.max(0,base.distance-s*typical),remainingAfterY:Math.max(0,base.distance-(s+1)*typical),shotDistance:typical+(((i+s)%5)-2)*5,estimatedDistance:true,penalty:(i+index===7&&s===0)?1:0});
    }
    let before=3.5+((i+index)%4)*.5;
    for(let p=0;p<putts;p++){
      const last=p===putts-1; const after=last?0:Math.max(.5,before-(1+((i+p)%3)*.5));
      shots.push({id:uid(),type:'putt',num:shots.length+1,puttBeforeM:before,puttAfterM:after,puttLie:['Flat'],puttCell:last?'Cup-in':['左','手前','右'][(i+p)%3]}); before=after;
    }
    holes.push({number:i+1,par:base.par,distance:base.distance,pin:'中央',memo:(i===3?`4H: ${index%2?'右サイド注意。':'奥から速い。'}`:''),shots,status:'done',score,stage:'done',currentRemainingY:0,currentPuttRemainingM:0,draft:shotDraft(),puttDraft:puttDraft()});
  }
  return {id:uid(),sample:true,date,courseName:'サンプルゴルフクラブ',section:'OUT / IN',tee:'Regular',weather:'晴',green:'A',holeCount:18,holes,currentHoleIndex:17,startedAt:date+'T08:00:00',completedAt:date+'T13:00:00'};
}
function seed(){
 const settings=defaultSettings(); const course=defaultCourse();
 const dates=['2026-08-15','2026-08-30','2026-09-14','2026-09-28','2026-10-03'];
 const scores=[94,92,89,93,91], putts=[32,31,29,33,32];
 return {version:1,settings,courses:[course],rounds:dates.map((d,i)=>sampleRound(d,scores[i],putts[i],i)),activeRound:null};
}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.version?mergeData(v):seed()}catch(e){return seed()}}
function mergeConfig(saved,defs){if(!Array.isArray(saved))return defs;const byLabel=new Map(saved.map(x=>[x?.label,x]));const base=defs.map(x=>{const old=byLabel.get(x.label);return old?{...x,...old,custom:false}:x});const custom=saved.filter(x=>x&&x.custom&&String(x.label||'').trim()&&!base.some(d=>d.label===x.label)).map(x=>({...x,label:String(x.label).trim(),custom:true}));return base.concat(custom)}
function mergeData(v){const s=defaultSettings(),vs=v.settings||{};return{version:1,settings:{...s,...vs,inputs:{...s.inputs,...(vs.inputs||{})},options:{...s.options,...(vs.options||{})},shotStyles:mergeConfig(vs.shotStyles,s.shotStyles),feedback:{good:mergeConfig(vs.feedback?.good,s.feedback.good),miss:mergeConfig(vs.feedback?.miss,s.feedback.miss)}},courses:Array.isArray(v.courses)?v.courses:[],rounds:Array.isArray(v.rounds)?v.rounds:[],activeRound:v.activeRound||null}}
let data=load();
let ui={screen:'home',prev:'home',dataTab:'recent',settingsScreen:null,viewRoundId:null,scorecardRoundId:null,modal:null,toast:'',start:{courseId:data.courses[0]?.id||'',courseName:'',frontSection:'OUT',backSection:'IN',frontSectionOther:'',backSectionOther:'',tee:'Regular',teeOther:'',weather:'晴',green:'A',holeCount:18},courseEditHalf:0,clubId:null,clubDraft:null,styleDraft:null,feedbackDraft:null,feedbackTab:'good'};
let lastRenderedScreen=ui.screen;
let lastRenderedPageKey='';
let historyReady=false;
if('scrollRestoration' in history)history.scrollRestoration='manual';
let restoringHistory=false;
function historyState(){return{shotlog:true,screen:ui.screen,prev:ui.prev,dataTab:ui.dataTab,viewRoundId:ui.viewRoundId,scorecardRoundId:ui.scorecardRoundId,clubId:ui.clubId}}
function applyHistoryState(s){
 if(!s||!s.shotlog){ui.screen='home';ui.prev='home';ui.modal=null;return}
 ui.screen=s.screen||'home';ui.prev=s.prev||'home';ui.dataTab=s.dataTab||ui.dataTab;ui.viewRoundId=s.viewRoundId||null;ui.scorecardRoundId=s.scorecardRoundId||null;ui.clubId=s.clubId||null;ui.modal=null;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function mutate(fn){fn();persist();render()}
function syncLiveShotButtons(){
 const h=currentHole(),d=h?.draft;if(!d)return;
 document.querySelectorAll('[data-draft]').forEach(btn=>{
   const k=btn.dataset.draft,v=btn.dataset.value;
   if(k==='penalty')btn.classList.toggle('active',Number(d.penalty)===Number(v));
   else btn.classList.toggle('active',d[k]===v);
 });
 document.querySelectorAll('[data-feel]').forEach(btn=>btn.classList.toggle('active',feelArray(d.feel).includes(btn.dataset.feel)));

 document.querySelectorAll('[data-draft-miss]').forEach(btn=>btn.classList.toggle('active',(d.misses||[]).includes(btn.dataset.draftMiss)));

 if(penaltyWrap)penaltyWrap.hidden=!['OB','ハザード','ペナルティ'].includes(d.landing);

 const h=currentHole(),d=h?.puttDraft;if(!d)return;
 d.lie=(d.lie||['フラット']).map(puttLieLabel);

function legacyCopyText(text){
 const ta=document.createElement('textarea');
 ta.value=String(text??'');
 ta.setAttribute('readonly','');
 ta.style.position='fixed';
 ta.style.left='-9999px';
 ta.style.top='0';
 ta.style.opacity='0';
 ta.style.pointerEvents='none';
 document.body.appendChild(ta);
 ta.focus();
 ta.select();
 try{ta.setSelectionRange(0,ta.value.length)}catch(e){}
 let ok=false;
 try{ok=document.execCommand('copy')}catch(e){}
 ta.remove();
 return ok;
}
function copyText(text){
 const value=String(text??'');
 // iPhoneのホーム画面追加(PWA)ではClipboard APIが失敗扱いになることがあるため、
 // ユーザー操作中に同期コピーを先に試し、失敗時だけClipboard APIへフォールバックする。
 if(legacyCopyText(value))return Promise.resolve(true);
 if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(value).then(()=>true).catch(()=>false);
 return Promise.resolve(false);
}
function enabledShotStyles(){return (data.settings.shotStyles||[]).filter(x=>x.enabled===true).map(x=>x.label)}
function enabledFeedback(type){return (data.settings.feedback?.[type]||[]).filter(x=>x.enabled===true).map(x=>x.label)}

function shotHasMiss(s){return (Array.isArray(s.misses)&&s.misses.length>0)||s.quality==='ミス'}
const SHOT_DIRECTIONS=['左','中央','右'];

const SHOT_LANDINGS=['FW','ラフ','バンカー','ハザード','エッジ','Green','OB','ペナルティ'];

const PUTT_LIE_PRIMARY=['フラット','上り','下り'];
const PUTT_LIE_SECONDARY=['フック','スライス'];
const PUTT_CELLS=['左奥','奥','右奥','左','Cup-in','右','左手前','手前','右手前'];

function togglePuttLie(list,value){let arr=(list||[]).map(puttLieLabel);if(value==='フラット')return arr.includes('フラット')?[]:['フラット'];arr=arr.filter(x=>x!=='フラット');if(PUTT_LIE_PRIMARY.includes(value))return toggleExclusiveGroup(arr,value,['上り','下り']);if(PUTT_LIE_SECONDARY.includes(value))return toggleExclusiveGroup(arr,value,PUTT_LIE_SECONDARY);return toggleArrayValue(arr,value)}
function toggleFeel(list,value){let arr=feelArray(list);if(FEEL_PRIMARY.includes(value))return toggleExclusiveGroup(arr,value,FEEL_PRIMARY);if(FEEL_VERTICAL.includes(value))return toggleExclusiveGroup(arr,value,FEEL_VERTICAL);if(FEEL_SIDE.includes(value))return toggleExclusiveGroup(arr,value,FEEL_SIDE);return arr.includes(value)?arr.filter(x=>x!==value):[...arr,value]}

function feedbackTagsHtml(s){const good=s.goods||[],miss=s.misses||[];if(!good.length&&!miss.length)return'';return '<div class="shot-tags">'+good.map(v=>'<span class="shot-tag good">'+esc(v)+'</span>').join('')+miss.map(v=>'<span class="shot-tag miss">'+esc(v)+'</span>').join('')+'</div>'}
const SLOPE_FEET=['左足上がり','左足下がり'];
const SLOPE_TOE=['つま先上がり','つま先下がり'];
function slopeArray(v){if(Array.isArray(v))return [...v];if(!v)return[];return [v]}
function toggleSlope(list,value){let arr=slopeArray(list);if(SLOPE_FEET.includes(value))return toggleExclusiveGroup(arr,value,SLOPE_FEET);if(SLOPE_TOE.includes(value))return toggleExclusiveGroup(arr,value,SLOPE_TOE);return arr.includes(value)?arr.filter(x=>x!==value):[...arr,value]}

function syncHoleAfterShotChange(h,preserveManualDone=false,manualScore=null){
 h.shots.forEach((s,i)=>s.num=i+1);const last=h.shots[h.shots.length-1];
 if(!last){h.status='open';h.score=null;h.stage='shot';h.currentRemainingY=h.distance;h.currentPuttRemainingM=null;return}
 if(last.type==='putt'){h.currentRemainingY=0;h.currentPuttRemainingM=Number(last.puttAfterM||0);if(Number(last.puttAfterM)===0){h.status='done';h.stage='done';h.score=holeComputedScore(h)}else if(preserveManualDone){h.status='done';h.stage='done';h.score=manualScore??holeComputedScore(h)}else{h.status='open';h.stage='putt';h.score=null}return}
 const after=Number(last.remainingAfterY);h.currentRemainingY=Number.isFinite(after)?after:h.distance;h.currentPuttRemainingM=null;if(preserveManualDone){h.status='done';h.stage='done';h.score=manualScore??holeComputedScore(h)}else{h.status='open';h.score=null;h.stage=last.landing==='Green'?'putt':'shot';if(last.landing==='Green'){h.currentRemainingY=0;h.currentPuttRemainingM=null}}
}

function nextStrokeNumber(h){return (h.shots||[]).length+1+holePenalty(h)}

function roundStats(r){
 const done=completedHoles(r), scores=done.map(h=>holeScore(h)), total=sum(scores), par=sum(done.map(h=>h.par)), putts=sum(done.map(h=>holePutts(h)));
 let fwN=0,fwD=0,girN=0,girD=done.length,ob=0,pen=0,bunker=0; const allShots=[];
 done.forEach(h=>{const shots=h.shots.filter(s=>s.type==='shot'); const tee=shots[0]; if(h.par>3&&tee){fwD++; if(tee.landing==='FW')fwN++} const greenAt=shots.findIndex(s=>s.landing==='Green'); if(greenAt>=0 && greenAt+1<=Math.max(1,h.par-2))girN++; shots.forEach(s=>{if(s.landing==='OB')ob++; if(s.landing==='バンカー')bunker++;pen+=Number(s.penalty||0);allShots.push(s)})});
 const scoreDist={birdie:0,par:0,bogey:0,double:0}; done.forEach(h=>{const d=holeScore(h)-h.par;if(d<=-1)scoreDist.birdie++;else if(d===0)scoreDist.par++;else if(d===1)scoreDist.bogey++;else scoreDist.double++});
 return{holes:done.length,total,par,diff:total-par,putts,fwN,fwD,fw:pct(fwN,fwD),girN,girD,gir:pct(girN,girD),ob,pen,bunker,allShots,scoreDist};
}

function lineChart(rs,st){const W=360,H=210,L=38,R=12,T=24,B=34,cw=(W-L-R)/(Math.max(1,rs.length-1));let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="FWとGIRの折れ線グラフ">`;[0,20,40,60,80,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);svg+=`<line class="chart-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+3}" font-size="8" fill="#667085">${v}%</text>`});const pts=(key)=>st.map((s,i)=>[L+cw*i,T+(H-T-B)*(1-s[key]/100)]);const pf=pts('fw'),pg=pts('gir');svg+=`<polyline fill="none" stroke="#FF6A24" stroke-width="2.5" points="${pf.map(p=>p.join(',')).join(' ')}"/><polyline fill="none" stroke="#2F6FE4" stroke-width="2.5" points="${pg.map(p=>p.join(',')).join(' ')}"/>`;st.forEach((s,i)=>{const x=L+cw*i;const yf=pf[i][1],yg=pg[i][1];svg+=`<circle cx="${x}" cy="${yf}" r="4" fill="#FF6A24"/><circle cx="${x}" cy="${yg}" r="4" fill="#2F6FE4"/><text x="${x}" y="${yf-7}" text-anchor="middle" font-size="8" fill="#FF6A24" font-weight="700">${s.fw}%</text><text x="${x}" y="${yg+14}" text-anchor="middle" font-size="8" fill="#2F6FE4" font-weight="700">${s.gir}%</text><text x="${x}" y="${H-11}" text-anchor="middle" font-size="8" fill="#667085">${fmtDate(rs[i].date)}</text>`});svg+=`<text x="${W-92}" y="12" font-size="9" fill="#FF6A24">● FW</text><text x="${W-48}" y="12" font-size="9" fill="#2F6FE4">● GIR</text></svg>`;return svg}

 if(e.touches.length!==1)return;
 const p=e.touches[0];
 // iPhoneで拾いやすいよう、画面左端〜80pxを戻るジェスチャー領域にする。
 // ボトムシート表示中はシート側の下スワイプを優先する。
 if(!document.querySelector('.sheet')&&p.clientX<=80)edgeSwipe={x:p.clientX,y:p.clientY,t:Date.now(),horizontal:false};
 else edgeSwipe=null;
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
 if(!edgeSwipe||e.touches.length!==1)return;
 const p=e.touches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y;
 if(!edgeSwipe.horizontal&&dx>8&&Math.abs(dx)>Math.abs(dy)*1.05)edgeSwipe.horizontal=true;
 if(edgeSwipe.horizontal&&dx>0)e.preventDefault();
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
 if(!edgeSwipe)return;
 const p=e.changedTouches[0],dx=p.clientX-edgeSwipe.x,dy=p.clientY-edgeSwipe.y,dt=Date.now()-edgeSwipe.t;
 const ok=edgeSwipe.horizontal&&dx>=42&&Math.abs(dy)<=100&&dt<=1200;
 edgeSwipe=null;
 if(ok)swipeBack();
},{passive:true,capture:true});
document.addEventListener('touchcancel',()=>{edgeSwipe=null},{passive:true,capture:true});

// ボトムシートは、シート最上部で下方向へスワイプすると閉じる。
// シート内部の通常スクロールを邪魔しないよう、scrollTop=0のときだけ反応する。
let sheetSwipe=null;
document.addEventListener('touchstart',e=>{
 const sheet=e.target.closest?.('.sheet');
 if(!sheet||e.touches.length!==1||sheet.scrollTop>0){sheetSwipe=null;return}
 const p=e.touches[0];
 sheetSwipe={sheet,x:p.clientX,y:p.clientY,lastY:p.clientY,t:Date.now(),dragging:false};
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
 if(!sheetSwipe||e.touches.length!==1)return;
 const p=e.touches[0],dx=p.clientX-sheetSwipe.x,dy=p.clientY-sheetSwipe.y;
 sheetSwipe.lastY=p.clientY;
 if(!sheetSwipe.dragging&&dy>10&&Math.abs(dy)>Math.abs(dx)*1.15)sheetSwipe.dragging=true;
 if(sheetSwipe.dragging&&dy>0){
   e.preventDefault();
   sheetSwipe.sheet.style.transform=`translateY(${Math.min(dy,140)}px)`;
 }
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
 if(!sheetSwipe)return;
 const p=e.changedTouches[0],dy=p.clientY-sheetSwipe.y,dx=p.clientX-sheetSwipe.x,dt=Date.now()-sheetSwipe.t;
 const sheet=sheetSwipe.sheet,close=sheetSwipe.dragging&&dy>=60&&Math.abs(dx)<=120&&dt<=1200;
 sheet.style.transform='';
 sheetSwipe=null;
 if(close&&ui.modal){ui.modal=null;render()}
},{passive:true,capture:true});
document.addEventListener('touchcancel',()=>{
 if(sheetSwipe?.sheet)sheetSwipe.sheet.style.transform='';
 sheetSwipe=null;
},{passive:true,capture:true});

function onInput(e){const el=e.target;
 if(el.dataset.resultMemo!==undefined){const r=roundById(el.dataset.roundId);if(r){r.resultMemo=el.value||'';persist()}return}
 if(el.id==='start-course-name')ui.start.courseName=el.value;
 else if(el.id==='start-front-other'){ui.start.frontSectionOther=el.value;const tab=document.querySelector('[data-section-tab="front"]');if(tab)tab.textContent=el.value.trim()||'その他'}
 else if(el.id==='start-back-other'){ui.start.backSectionOther=el.value;const tab=document.querySelector('[data-section-tab="back"]');if(tab)tab.textContent=el.value.trim()||'その他'}
 else if(el.id==='start-tee-other')ui.start.teeOther=el.value;
 else if(el.id==='start-green')ui.start.green=el.value;
 else if(el.id==='direct-distance'){const h=currentHole(),v=Number(el.value),rem=document.getElementById('remaining-after');if(h&&rem&&Number.isFinite(v)&&v>=0){const after=Math.max(0,Number(h.currentRemainingY||0)-v);rem.value=after;h.draft.directDistance=el.value;h.draft.remainingAfterY=after;persist()}}
 else if(el.id==='edit-shot-distance'&&ui.modal?.type==='editShot'){const r=currentRound(),h=r?.holes.find(x=>x.number===Number(ui.modal.hole)),sh=h?.shots?.[Number(ui.modal.index)],v=Number(el.value),rem=document.getElementById('edit-shot-remaining');if(sh&&rem&&Number.isFinite(v)&&v>=0){const after=Math.max(0,Number(sh.remainingBeforeY||0)-v);rem.value=after;ui.modal.draft.directDistance=el.value;ui.modal.draft.remainingAfterY=after}}
 else if(el.id==='putt-after-custom'){const h=currentHole(),v=Number(el.value);if(h&&Number.isFinite(v)&&v>=0){h.puttDraft.afterM=Math.round(v*2)/2;persist();syncLivePuttControls()}}
 else if(el.id==='edit-putt-after-custom'&&ui.modal?.type==='editShot'){const v=Number(el.value);if(Number.isFinite(v)&&v>=0)ui.modal.draft.afterM=Math.round(v*2)/2}
}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);
render();
})();
</script>
</body>
</html>
