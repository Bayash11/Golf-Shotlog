<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#0c2b45" />
<title>Shot log</title>
<meta name="description" content="Shot log — Play. Record. Reflect. ラウンド中の一打を、素早く記録して振り返るゴルフショットログ。" />
<style>
:root{
  --navy:#0c2b45;--navy2:#153d5d;--navy3:#214f72;--ink:#142331;--muted:#6c7781;
  --ivory:#f7f4ed;--paper:#fffdfa;--line:#dedbd4;--green:#1f624f;--green2:#2f8069;
  --red:#df5a57;--soft:#eef2f4;--shadow:0 12px 34px rgba(16,37,53,.10);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{border:0}.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--ivory);position:relative;padding-bottom:92px}.screen{display:none}.screen.active{display:block}.safe{padding:max(16px,env(safe-area-inset-top)) 18px 18px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 12px;background:rgba(247,244,237,.96);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(0,0,0,.05)}.topbar h2{font-size:17px;margin:0}.back,.iconbtn{width:40px;height:40px;border-radius:50%;background:transparent;color:var(--navy);font-size:24px}.topbar .ghost{width:40px}.brand{font-family:"Snell Roundhand","Segoe Script","Bradley Hand",cursive;font-size:48px;font-weight:700;line-height:.95;letter-spacing:-2px;color:white;transform:rotate(-3deg);display:inline-block}.brand-dot{width:9px;height:9px;background:var(--red);border-radius:50%;display:inline-block;margin-left:5px;vertical-align:top;margin-top:10px}.tagline{font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.8);margin-top:14px;text-transform:uppercase}.hero{background:linear-gradient(160deg,#09283f 0%,#174565 100%);padding:max(40px,env(safe-area-inset-top)) 22px 28px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.08);right:-100px;top:-75px}.hero-copy{position:relative;z-index:1}.hero p{color:rgba(255,255,255,.75);margin:12px 0 0;font-size:14px}.card{background:var(--paper);border:1px solid rgba(20,35,49,.07);border-radius:20px;box-shadow:var(--shadow)}.home-card{margin:-20px 16px 0;position:relative;z-index:3;padding:14px}.primary{width:100%;min-height:54px;border-radius:16px;background:var(--navy);color:white;font-weight:800;padding:14px 18px;box-shadow:0 8px 20px rgba(12,43,69,.18)}.primary.green{background:var(--green)}.secondary{width:100%;min-height:50px;border-radius:15px;background:white;border:1px solid var(--line);font-weight:700;color:var(--navy)}.menu{padding:12px 16px}.menu-row{display:flex;align-items:center;gap:12px;background:var(--paper);padding:15px 16px;border-radius:15px;margin-bottom:9px;border:1px solid rgba(20,35,49,.07)}.menu-ico{width:34px;height:34px;border-radius:11px;background:#eaf0f4;color:var(--navy);display:grid;place-items:center;font-weight:900}.menu-row b{font-size:14px}.menu-row small{display:block;color:var(--muted);margin-top:3px}.chev{margin-left:auto;color:#8f9ba4;font-size:22px}.section-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:18px 2px 8px}.form-card{margin:12px 16px;padding:16px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#56616c}.input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:white;padding:0 14px;outline:none;font-size:16px}.input:focus{border-color:#8da8bb;box-shadow:0 0 0 3px rgba(53,102,134,.08)}.tabs{display:flex;padding:4px;background:#eeece6;border-radius:12px}.tabs button{flex:1;padding:9px;border-radius:10px;background:transparent;color:#66717a;font-weight:800}.tabs button.active{background:var(--navy);color:white}.holes-editor{margin-top:12px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.hole-row{display:grid;grid-template-columns:38px 1fr 1fr;gap:8px;align-items:center;padding:9px 10px;background:white;border-bottom:1px solid #eeeae3}.hole-row:last-child{border-bottom:0}.hole-row strong{text-align:center}.mini-input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#fff}.round-head{background:linear-gradient(150deg,var(--navy),var(--navy2));color:white;padding:max(22px,env(safe-area-inset-top)) 18px 20px}.round-top{display:flex;justify-content:space-between;align-items:center}.round-hole{font-size:28px;font-weight:900}.round-meta{font-size:13px;opacity:.8;margin-top:2px}.remaining-block{margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end}.remaining-label{font-size:11px;letter-spacing:.1em;opacity:.75}.remaining-value{font-size:46px;font-weight:900;line-height:1}.remaining-value small{font-size:18px}.stroke-badge{font-size:14px;font-weight:900;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:999px}.shot-list{padding:14px 16px}.shot-item{display:grid;grid-template-columns:34px 52px 1fr auto;gap:8px;align-items:start;background:var(--paper);border:1px solid rgba(20,35,49,.06);border-radius:15px;padding:12px 10px;margin-bottom:8px}.shot-num{width:30px;height:30px;border-radius:10px;background:#edf1f4;color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:900}.shot-club{font-weight:900;font-size:14px;padding-top:4px}.shot-main{font-size:13px;font-weight:800}.shot-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}.shot-distance{font-size:12px;font-weight:900;color:var(--navy);padding-top:4px}.round-actions{padding:2px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.round-actions .primary{grid-column:1/-1}.tiny{font-size:11px;color:var(--muted);text-align:center;margin:5px 0 0}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chips.three{grid-template-columns:repeat(3,1fr)}.chip{min-height:45px;border-radius:12px;background:#f0eee9;color:#45515b;font-size:13px;font-weight:800;padding:8px 4px;border:1px solid transparent}.chip.selected{background:var(--navy);color:white}.chip.green.selected{background:var(--green)}.chip.danger.selected{background:#8d3535}.shot-form{padding:0 16px 24px}.shot-form .card{padding:15px;margin-bottom:11px}.shot-form h3{font-size:13px;margin:0 0 10px}.optional{color:#9099a0;font-weight:600}.distance-row{display:flex;align-items:center;gap:8px}.distance-row .input{font-size:24px;font-weight:900;text-align:center}.unit{min-width:44px;font-weight:900;color:var(--muted)}.toggle-note{font-size:11px;color:var(--muted);margin-top:6px}.putt-hero{padding:15px;background:#f1f4f5;border-radius:15px}.putt-big{font-size:31px;font-weight:900}.hole-finish{padding:30px 18px;text-align:center}.hole-finish .flag{font-size:34px}.hole-finish h2{margin:8px 0 0}.score-box{display:grid;grid-template-columns:1fr 1fr;margin:22px auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:white}.score-box>div{padding:20px 8px}.score-box>div+div{border-left:1px solid var(--line)}.score-box strong{font-size:42px;display:block}.score-box small{font-size:12px;color:var(--muted);font-weight:800}.score-box em{font-style:normal;font-size:14px;color:var(--muted)}.score-list{margin:12px 16px}.score-row{display:grid;grid-template-columns:45px 1fr 75px 65px;align-items:center;background:white;border-bottom:1px solid #eeeae3;padding:13px 12px}.score-row:first-child{border-radius:15px 15px 0 0}.score-row:last-child{border-radius:0 0 15px 15px;border-bottom:0}.score-row .h{font-weight:900}.score-row .par{font-size:12px;color:var(--muted)}.score-row .score{text-align:center;font-weight:900}.score-row .putts{text-align:right;color:var(--muted);font-size:12px}.summary-hero{background:var(--navy);color:white;padding:max(34px,env(safe-area-inset-top)) 18px 24px}.summary-hero h1{margin:0;font-size:24px}.summary-score{font-size:58px;font-weight:900;margin-top:10px}.summary-score small{font-size:15px;opacity:.75}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}.stat{padding:16px}.stat span{font-size:11px;color:var(--muted);font-weight:800}.stat strong{font-size:26px;display:block;margin-top:3px}.analysis{padding:0 16px 20px}.analysis .card{padding:15px;margin-bottom:10px}.bar-row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bar{height:8px;background:#ebe9e4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,253,250,.96);border-top:1px solid rgba(20,35,49,.08);padding:8px 12px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);z-index:30;backdrop-filter:blur(15px)}.bottom-nav button{background:transparent;color:#7c8790;font-size:10px;font-weight:800;padding:5px}.bottom-nav button span{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}.bottom-nav button.active{color:var(--navy)}.modal{position:fixed;inset:0;background:rgba(9,27,40,.5);display:none;align-items:flex-end;z-index:100}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:0 auto;background:var(--ivory);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding-bottom:max(22px,env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;position:sticky;top:0;background:rgba(247,244,237,.97);z-index:2}.sheet-head h2{margin:0;font-size:17px}.close{width:36px;height:36px;border-radius:50%;background:#e9e7e2;font-size:20px}.danger-text{color:#a33d3d}.note{font-size:12px;color:var(--muted);line-height:1.6}.record-dot{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;vertical-align:middle;margin-left:3px}.edit-link{font-size:12px;color:white;text-decoration:underline;background:transparent}.hidden{display:none!important}
@media(min-width:700px){body{background:#e8ecef}.app{box-shadow:0 0 40px rgba(10,30,45,.12)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const CLUBS=['Dr','3W','5W','3U','4U','5I','6I','7I','8I','9I','PW','48°','52°','58°','PT'];
const STORAGE_KEY='shotlog_rounds_v1'; const ACTIVE_KEY='shotlog_active_v1';
let view='home'; let activeRound=null; let activeHoleIndex=0; let shotDraft=null; let modalOpen=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function loadRounds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function saveRounds(x){localStorage.setItem(STORAGE_KEY,JSON.stringify(x))}
function saveActive(){activeRound?localStorage.setItem(ACTIVE_KEY,JSON.stringify(activeRound)):localStorage.removeItem(ACTIVE_KEY)}
function loadActive(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null')}catch{return null}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function defaultHoles(){return Array.from({length:18},(_,i)=>({number:i+1,par:[4,4,3,5,4,4,3,5,4,4,4,3,5,4,4,3,5,4][i],yard:[350,382,165,510,395,370,155,525,360,390,345,175,515,405,385,160,530,375][i],shots:[],manualScore:null,manualPutts:null,done:false}))}
function go(v){view=v;modalOpen=false;render();scrollTo(0,0)}
function currentHole(){return activeRound?.holes?.[activeHoleIndex]}
function currentRemaining(h=currentHole()){if(!h)return null;if(!h.shots.length)return h.yard; const last=[...h.shots].reverse().find(s=>s.remainingYd!=null); return last?last.remainingYd:null}
function scoreFor(h){return h.manualScore??h.shots.length}
function puttsFor(h){return h.manualPutts??h.shots.filter(s=>s.club==='PT').length}
function diff(h){return scoreFor(h)-h.par}
function diffText(n){return n===0?'E':n>0?`+${n}`:`${n}`}
function totalStats(r){const done=r.holes.filter(h=>h.done);const total=done.reduce((a,h)=>a+scoreFor(h),0);const par=done.reduce((a,h)=>a+h.par,0);const putts=done.reduce((a,h)=>a+puttsFor(h),0);return{done:done.length,total,par,diff:total-par,putts}}
function nav(){return `<nav class="bottom-nav"><button onclick="go('home')" class="${view==='home'?'active':''}"><span>⌂</span>ホーム</button><button onclick="${activeRound?"go('round')":"go('history')"}" class="${view==='round'?'active':''}"><span>⚑</span>${activeRound?'ラウンド':'履歴'}</button><button onclick="go('history')" class="${['history','summary'].includes(view)?'active':''}"><span>▥</span>記録</button></nav>`}
function home(){const ar=loadActive();return `<section class="screen active"><div class="hero"><div class="hero-copy"><div><span class="brand">Shot log</span><span class="brand-dot"></span></div><div class="tagline">Play. Record. Reflect.</div><p>あの一打を、あとで見返そう。</p></div></div><div class="home-card card">${ar?`<button class="primary green" onclick="resumeRound()">ラウンドを再開</button><p class="tiny">${esc(ar.courseName||'ラウンド')} ・ Hole ${ar.holes.find(h=>!h.done)?.number||18}</p>`:`<button class="primary" onclick="go('setup')">ラウンドを始める</button>`}</div><div class="menu"><div class="section-title">Shot log</div><div class="menu-row" onclick="go('history')"><div class="menu-ico">▥</div><div><b>過去のラウンド</b><small>ショットごとの記録を見返す</small></div><div class="chev">›</div></div><div class="menu-row" onclick="go('history')"><div class="menu-ico">↗</div><div><b>データを見る</b><small>クラブ・ミス・パットを振り返る</small></div><div class="chev">›</div></div><div class="menu-row"><div class="menu-ico">i</div><div><b>このアプリについて</b><small>Play. Record. Reflect.</small></div></div></div></section>${nav()}`}
function setup(){const holes=defaultHoles();window._setupHoles=holes;return `<div class="topbar"><button class="back" onclick="go('home')">‹</button><h2>ラウンド設定</h2><div class="ghost"></div></div><div class="form-card card"><div class="field"><label>コース名 <span class="optional">任意</span></label><input id="courseName" class="input" placeholder="例：○○カントリークラブ"></div><div class="field"><label>日付</label><input id="roundDate" type="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ホール</label><div class="tabs"><button class="active" onclick="setHoleCount(18,this)">18H</button><button onclick="setHoleCount(9,this)">9H</button></div></div><div class="section-title">距離・PAR</div><p class="note">事前入力でも、ラウンド中の修正でもOKです。</p><div id="holesEditor" class="holes-editor">${holes.slice(0,18).map(h=>holeEditorRow(h)).join('')}</div><button class="primary" style="margin-top:16px" onclick="startRound()">この設定で開始</button></div>`}
function holeEditorRow(h){return `<div class="hole-row" data-hole="${h.number}"><strong>${h.number}</strong><select class="mini-input par"><option ${h.par===3?'selected':''}>3</option><option ${h.par===4?'selected':''}>4</option><option ${h.par===5?'selected':''}>5</option></select><input class="mini-input yard" type="number" inputmode="numeric" value="${h.yard}" aria-label="${h.number}番ホール距離"></div>`}
function setHoleCount(n,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.hole-row').forEach((r,i)=>r.style.display=i<n?'grid':'none');window._holeCount=n}
function startRound(){const rows=[...document.querySelectorAll('.hole-row')].filter(r=>r.style.display!=='none');const holes=rows.map((r,i)=>({number:i+1,par:+r.querySelector('.par').value,yard:+r.querySelector('.yard').value||0,shots:[],manualScore:null,manualPutts:null,done:false}));activeRound={id:uid(),courseName:$('#courseName').value.trim(),date:$('#roundDate').value,startedAt:new Date().toISOString(),holes};activeHoleIndex=0;saveActive();go('round')}
function resumeRound(){activeRound=loadActive();activeHoleIndex=Math.max(0,activeRound.holes.findIndex(h=>!h.done));if(activeHoleIndex<0)activeHoleIndex=0;go('round')}
function round(){if(!activeRound){const a=loadActive();if(a)activeRound=a;else return home()}const h=currentHole(),rem=currentRemaining(h);return `<div class="round-head"><div class="round-top"><div><div class="round-hole">Hole ${h.number}</div><div class="round-meta">PAR ${h.par} ・ ${h.yard} yd</div></div><button class="edit-link" onclick="editHoleInfo()">距離/PAR修正</button></div><div class="remaining-block"><div><div class="remaining-label">現在の残り距離</div><div class="remaining-value">${rem==null?'—':rem}<small>${rem==null?'':' yd'}</small></div></div><div class="stroke-badge">${h.shots.length+1}打目</div></div></div><div class="shot-list">${h.shots.length?h.shots.map((s,i)=>shotItem(s,i,h)).join(''):`<div class="empty" style="padding:30px 10px">まだショットはありません。<br>打った後に結果だけ記録します。</div>`}</div><div class="round-actions"><button class="primary" onclick="openShot()">＋ ショットを記録</button><button class="secondary" onclick="undoShot()">1打戻す</button><button class="secondary" onclick="finishHole()">ホール終了</button></div><p class="tiny">狙いは入力しません。プレーに集中して、結果だけ残します。</p>${nav()}`}
function shotItem(s,i,h){const bits=[s.result,s.direction,s.curve,...(s.feels||[]),s.puttResult].filter(Boolean);const dist=s.actualYd!=null?`${s.actualYd}${s.club==='PT'?'m':'yd'}`:s.estimatedYd!=null?`約${s.estimatedYd}yd`:'';return `<div class="shot-item" onclick="editShot(${i})"><div class="shot-num">${i+1}</div><div class="shot-club">${esc(s.club)}</div><div><div class="shot-main">${esc(bits.join('・')||'記録')}</div><div class="shot-sub">${s.remainingYd!=null&&s.club!=='PT'?`次の残り ${s.remainingYd}yd`:s.club==='PT'&&s.remainingM!=null?`次 ${s.remainingM}m`:''}</div></div><div class="shot-distance">${dist}</div></div>`}
function openShot(index=null){const h=currentHole();const s=index==null?null:h.shots[index];const rem=currentRemaining(h);shotDraft=s?JSON.parse(JSON.stringify(s)):{id:uid(),club:h.shots.length===0?'Dr':'',result:'',direction:'',curve:'',feels:[],actualYd:null,remainingYd:null,startDistanceYd:rem,puttStartM:null,remainingM:null,puttResult:'',editIndex:index};if(s)shotDraft.editIndex=index;modalOpen=true;renderModal()}
function editShot(i){openShot(i)}
function renderModal(){let m=$('#shotModal');if(!m){m=document.createElement('div');m.id='shotModal';m.className='modal';document.body.appendChild(m)}m.className='modal open';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${shotDraft?.editIndex!=null?'ショットを修正':'ショット入力'}</h2><button class="close" onclick="closeModal()">×</button></div><div id="shotBody">${shotForm()}</div></div>`}
function closeModal(){modalOpen=false;$('#shotModal')?.remove()}
function shotForm(){if(!shotDraft)return'';const putt=shotDraft.club==='PT';return `<div class="shot-form"><div class="card"><h3>クラブ</h3><div class="chips">${CLUBS.map(c=>`<button class="chip ${shotDraft.club===c?'selected':''}" onclick="setDraft('club','${c}')">${c}</button>`).join('')}</div></div>${putt?puttForm():normalForm()}<button class="primary" onclick="saveShot()">このショットを保存</button>${shotDraft.editIndex!=null?`<button class="secondary danger-text" style="margin-top:8px" onclick="deleteShot(${shotDraft.editIndex})">このショットを削除</button>`:''}</div>`}
function normalForm(){const results=['FW','ラフ','グリーン','バンカー','OB','ペナルティ','手前','その他'];const dirs=['左','中央','右'];const curves=['ストレート','フェード','ドロー'];const feels=['振り切れた','バニラ','手打ち','ダフリ','トップ','フェース開き','芯外し'];return `<div class="card"><h3>結果 <span class="optional">どこにいきましたか？</span></h3><div class="chips">${chips('result',results)}</div></div><div class="card"><h3>方向 <span class="optional">任意</span></h3><div class="chips three">${chips('direction',dirs)}</div></div><div class="card"><h3>球筋 <span class="optional">任意</span></h3><div class="chips three">${chips('curve',curves)}</div></div><div class="card"><h3>打感・ミス <span class="optional">複数可</span></h3><div class="chips three">${feels.map(v=>`<button class="chip ${shotDraft.feels.includes(v)?'selected':''}" onclick="toggleFeel('${v}')">${v}</button>`).join('')}</div></div><div class="card"><h3>次の残り距離 <span class="optional">推定飛距離に利用</span></h3><div class="distance-row"><input class="input" type="number" inputmode="decimal" placeholder="例 120" value="${shotDraft.remainingYd??''}" oninput="shotDraft.remainingYd=this.value===''?null:+this.value"><span class="unit">yd</span></div><div class="toggle-note">現在 ${shotDraft.startDistanceYd??'—'}yd → 次の残りを入れると、前進距離を自動推定します。</div></div><div class="card"><h3>実測の飛距離 <span class="optional">わかる時だけ</span></h3><div class="distance-row"><input class="input" type="number" inputmode="decimal" placeholder="例 230" value="${shotDraft.actualYd??''}" oninput="shotDraft.actualYd=this.value===''?null:+this.value"><span class="unit">yd</span></div></div>`}
function puttForm(){const r=['カップイン','ショート','オーバー','左に外し','右に外し','カップ1個外し','OK'];return `<div class="card"><div class="putt-hero"><h3>パター</h3><div class="putt-big">距離と結果だけ</div><p class="note">パットは専用入力にしています。</p></div></div><div class="card"><h3>打つ前の距離 <span class="optional">任意</span></h3><div class="distance-row"><input class="input" type="number" step="0.1" inputmode="decimal" placeholder="例 3" value="${shotDraft.puttStartM??''}" oninput="shotDraft.puttStartM=this.value===''?null:+this.value"><span class="unit">m</span></div></div><div class="card"><h3>結果</h3><div class="chips three">${chips('puttResult',r)}</div></div><div class="card"><h3>次の距離 <span class="optional">入ったら0</span></h3><div class="distance-row"><input class="input" type="number" step="0.1" inputmode="decimal" placeholder="例 1.5" value="${shotDraft.remainingM??''}" oninput="shotDraft.remainingM=this.value===''?null:+this.value"><span class="unit">m</span></div></div>`}
function chips(field,arr){return arr.map(v=>`<button class="chip ${shotDraft[field]===v?'selected':''}" onclick="setDraft('${field}','${v}')">${v}</button>`).join('')}
function setDraft(f,v){shotDraft[f]=v;if(f==='club'&&v==='PT'){shotDraft.result='';shotDraft.direction='';shotDraft.curve='';shotDraft.feels=[]}refreshShotBody()}
function toggleFeel(v){const a=shotDraft.feels;const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);refreshShotBody()}
function refreshShotBody(){const b=$('#shotBody');if(b)b.innerHTML=shotForm()}
function saveShot(){if(!shotDraft.club){alert('クラブを選択してください');return}const h=currentHole();if(shotDraft.club!=='PT'&&shotDraft.actualYd==null&&shotDraft.startDistanceYd!=null&&shotDraft.remainingYd!=null){shotDraft.estimatedYd=Math.max(0,Math.round(shotDraft.startDistanceYd-shotDraft.remainingYd))}else if(shotDraft.actualYd!=null){shotDraft.estimatedYd=null}if(shotDraft.club==='PT'&&['カップイン','OK'].includes(shotDraft.puttResult)&&shotDraft.remainingM==null)shotDraft.remainingM=0;const idx=shotDraft.editIndex;delete shotDraft.editIndex;if(idx!=null)h.shots[idx]=shotDraft;else h.shots.push(shotDraft);saveActive();closeModal();render()}
function deleteShot(i){if(confirm('このショットを削除しますか？')){currentHole().shots.splice(i,1);saveActive();closeModal();render()}}
function undoShot(){const h=currentHole();if(!h.shots.length)return;if(confirm('最後の1打を取り消しますか？')){h.shots.pop();saveActive();render()}}
function editHoleInfo(){const h=currentHole();const yard=prompt('ホール距離（yd）',h.yard);if(yard===null)return;const par=prompt('PAR（3 / 4 / 5）',h.par);if(par===null)return;h.yard=Math.max(0,+yard||0);h.par=[3,4,5].includes(+par)?+par:h.par;saveActive();render()}
function finishHole(){const h=currentHole();if(!h.shots.length&&!confirm('ショット記録なしでホール終了しますか？'))return;view='holeFinish';render();scrollTo(0,0)}
function holeFinish(){const h=currentHole(),score=scoreFor(h),putts=puttsFor(h),d=score-h.par;return `<div class="topbar"><button class="back" onclick="go('round')">‹</button><h2>Hole ${h.number}</h2><div class="ghost"></div></div><div class="hole-finish"><div class="flag">⚑</div><h2>Hole ${h.number} 完了</h2><div class="round-meta" style="color:var(--muted)">PAR ${h.par} ・ ${h.yard}yd</div><div class="score-box"><div><small>スコア</small><strong>${score}</strong><em>${diffText(d)}</em></div><div><small>パット</small><strong>${putts}</strong><em>PUTT</em></div></div><button class="secondary" onclick="manualScore()">打数・パット数を修正</button><button class="primary green" style="margin-top:10px" onclick="nextHole()">${activeHoleIndex===activeRound.holes.length-1?'ラウンドを終了':'次のホールへ'}</button></div>`}
function manualScore(){const h=currentHole();const s=prompt('スコア（打数）',scoreFor(h));if(s===null)return;const p=prompt('パット数',puttsFor(h));if(p===null)return;h.manualScore=Math.max(1,+s||scoreFor(h));h.manualPutts=Math.max(0,+p||0);saveActive();render()}
function nextHole(){const h=currentHole();h.done=true;saveActive();if(activeHoleIndex>=activeRound.holes.length-1){completeRound();return}activeHoleIndex++;go('round')}
function completeRound(){activeRound.completedAt=new Date().toISOString();const rounds=loadRounds();rounds.unshift(activeRound);saveRounds(rounds);localStorage.removeItem(ACTIVE_KEY);const completed=activeRound;activeRound=null;window._summaryRound=completed;view='summary';render();scrollTo(0,0)}
function history(){const rounds=loadRounds();return `<div class="topbar"><button class="back" onclick="go('home')">‹</button><h2>過去のラウンド</h2><div class="ghost"></div></div>${rounds.length?`<div class="menu">${rounds.map((r,i)=>{const st=totalStats(r);return `<div class="menu-row" onclick="openSummary(${i})"><div class="menu-ico">${st.total||'–'}</div><div><b>${esc(r.courseName||'ラウンド')}</b><small>${esc(r.date||'')} ・ ${st.done}H ・ ${st.putts} putts</small></div><div class="chev">›</div></div>`}).join('')}</div>`:`<div class="empty">まだラウンド記録はありません。</div>`}${nav()}`}
function openSummary(i){window._summaryRound=loadRounds()[i];go('summary')}
function summary(){const r=window._summaryRound||loadRounds()[0];if(!r)return history();const st=totalStats(r),shots=r.holes.flatMap(h=>h.shots);const nonPutt=shots.filter(s=>s.club!=='PT');const feelCounts={};nonPutt.forEach(s=>(s.feels||[]).forEach(f=>feelCounts[f]=(feelCounts[f]||0)+1));const dirCounts={左:0,中央:0,右:0};nonPutt.forEach(s=>{if(dirCounts[s.direction]!=null)dirCounts[s.direction]++});const clubCounts={};shots.forEach(s=>clubCounts[s.club]=(clubCounts[s.club]||0)+1);const topFeels=Object.entries(feelCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);const topClubs=Object.entries(clubCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="summary-hero"><button class="edit-link" onclick="go('history')">‹ 記録一覧</button><h1>${esc(r.courseName||'Round')}</h1><div class="round-meta">${esc(r.date||'')} ・ ${st.done}H</div><div class="summary-score">${st.total}<small> ${diffText(st.diff)}</small></div><div class="tagline">Play. Record. Reflect.</div></div><div class="stat-grid"><div class="card stat"><span>PUTTS</span><strong>${st.putts}</strong></div><div class="card stat"><span>RECORDED SHOTS</span><strong>${shots.length}</strong></div></div><div class="analysis"><div class="section-title">Direction</div><div class="card">${barRows(dirCounts)}</div><div class="section-title">Feel & Miss</div><div class="card">${topFeels.length?barRows(Object.fromEntries(topFeels)):'<p class="note">まだ打感・ミスの記録がありません。</p>'}</div><div class="section-title">Club Usage</div><div class="card">${topClubs.length?barRows(Object.fromEntries(topClubs)):'<p class="note">記録がありません。</p>'}</div><button class="secondary" onclick="deleteRound('${r.id}')">このラウンドを削除</button></div>${nav()}`}
function barRows(obj){const vals=Object.values(obj),max=Math.max(1,...vals);return Object.entries(obj).map(([k,v])=>`<div class="bar-row"><b>${esc(k)}</b><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div><strong>${v}</strong></div>`).join('')}
function deleteRound(id){if(!confirm('このラウンドを削除しますか？'))return;saveRounds(loadRounds().filter(r=>r.id!==id));window._summaryRound=null;go('history')}
function render(){let html='';if(view==='home')html=home();else if(view==='setup')html=setup();else if(view==='round')html=round();else if(view==='holeFinish')html=holeFinish();else if(view==='history')html=history();else if(view==='summary')html=summary();$('#app').innerHTML=html}
window.addEventListener('load',()=>{render()});
</script>
</body>
</html>
